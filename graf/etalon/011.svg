<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="38.0" x2="14.0" y2="228.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="258.2" cy="38.0" rx="157.8" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="258.2" cy="38.0" rx="153.8" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="258.2" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Как сложить дроби с разными</text><text x="258.2" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">знаменателями</text><rect x="434.0" y="22.0" width="230.0" height="32.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M434.0,31.0L415.0,38.0L434.0,45.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="434.0" y1="32.4" x2="434.0" y2="43.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="549.0" y="41.0" font-size="13" text-anchor="middle" fill="#111">Пример: 1/4 + 1/6</text><line x1="14.0" y1="38.0" x2="100.4" y2="38.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="82.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="80.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="99.0" font-size="13" text-anchor="start" fill="#111">1. Найти общий знаменатель — НОК знаменателей: НОК(4, 6) = 12.</text></g></g><line x1="14.0" y1="96.0" x2="30.0" y2="96.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="126.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="124.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="143.0" font-size="13" text-anchor="start" fill="#111">2. Найти дополнительные множители: 12 : 4 = 3, 12 : 6 = 2.</text></g></g><line x1="14.0" y1="140.0" x2="30.0" y2="140.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="170.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="168.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="187.0" font-size="13" text-anchor="start" fill="#111">3. Умножить числители на дополнительные множители: 3/12 + 2/12.</text></g></g><line x1="14.0" y1="184.0" x2="30.0" y2="184.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="214.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="212.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="231.0" font-size="13" text-anchor="start" fill="#111">4. Сложить числители: 5/12.</text></g></g><line x1="14.0" y1="228.0" x2="30.0" y2="228.0" stroke="#993300" stroke-width="1.5"/></g></svg>