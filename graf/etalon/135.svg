<svg xmlns="http://www.w3.org/2000/svg" width="680" height="227" viewBox="0 0 680 227" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="186.1" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="182.1" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Найдите все натуральные n,</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">при которых n² + 1 делится на 3</text><rect x="100.0" y="80.0" width="480.0" height="131.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="97.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="132.1" y="120.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="138.1" y="120.0" font-size="15" text-anchor="start" fill="#111">n ≡ 0, 1, 2 (mod 3)</text><text x="132.1" y="144.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="138.1" y="144.0" font-size="15" text-anchor="start" fill="#111">n² ≡ 0, 1, 1 (mod 3)</text><line x1="304.4" y1="133.0" x2="304.4" y2="148.0" stroke="#993300" stroke-width="1"/><text x="312.4" y="143.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">перебрали все остатки при делении на 3</text><text x="132.1" y="168.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="138.1" y="168.0" font-size="15" text-anchor="start" fill="#111">n² + 1 ≡ 1, 2, 2 (mod 3)</text><text x="132.1" y="192.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇔</text><text x="138.1" y="192.0" font-size="15" text-anchor="start" fill="#111">никогда не делится на 3</text><line x1="304.4" y1="181.0" x2="304.4" y2="196.0" stroke="#993300" stroke-width="1"/><text x="312.4" y="191.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">ни один остаток не равен нулю</text></g></svg>