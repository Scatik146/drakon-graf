<svg xmlns="http://www.w3.org/2000/svg" width="680" height="271" viewBox="0 0 680 271" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><path d="M10.0,16.0H146.0L160.0,48.5L146.0,81.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="35.0" font-size="14" text-anchor="middle" fill="#111">Теорема о сумме</text><text x="79.0" y="52.0" font-size="14" text-anchor="middle" fill="#111">углов</text><text x="79.0" y="69.0" font-size="14" text-anchor="middle" fill="#111">треугольника</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="77.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="77.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Сумма углов треугольника равна 180°.</text><rect x="178.0" y="46.0" width="444.0" height="33.0" rx="0" fill="#fff" stroke="#993300" stroke-width="2"/><text x="400.0" y="66.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">∠A + ∠B + ∠C = 180°</text></g></g><rect x="640.0" y="35.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="52.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,102.0H146.0L160.0,117.5L146.0,133.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="121.0" font-size="14" text-anchor="middle" fill="#111">Следствие 1</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="103.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="101.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="121.0" font-size="14" text-anchor="start" fill="#111">В треугольнике не может быть двух тупых углов.</text></g></g><rect x="640.0" y="104.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="121.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2</text><path d="M10.0,149.0H146.0L160.0,164.5L146.0,180.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="168.0" font-size="14" text-anchor="middle" fill="#111">Следствие 2</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="150.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="148.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="168.0" font-size="14" text-anchor="start" fill="#111">Сумма острых углов прямоугольного треугольника равна 90°.</text></g></g><rect x="640.0" y="151.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="168.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3</text><rect x="260.0" y="203.0" width="360.0" height="50.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,203.0L382.0,182.0L376.0,203.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="361.6" y1="203.0" x2="374.4" y2="203.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="440.0" y="223.0" font-size="14" text-anchor="middle" fill="#111">Внешний угол равен сумме двух внутренних,</text><text x="440.0" y="240.0" font-size="14" text-anchor="middle" fill="#111">не смежных с ним</text></g></svg>