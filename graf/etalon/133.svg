<svg xmlns="http://www.w3.org/2000/svg" width="680" height="221" viewBox="0 0 680 221" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Докажите: a² + b² ≥ 2ab</text><rect x="100.0" y="62.0" width="480.0" height="103.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="78.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="120.2" y="100.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="126.2" y="100.0" font-size="14" text-anchor="start" fill="#111">a² + b² − 2ab</text><text x="120.2" y="123.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="126.2" y="123.0" font-size="14" text-anchor="start" fill="#111">(a − b)²</text><line x1="214.3" y1="113.0" x2="214.3" y2="127.0" stroke="#993300" stroke-width="1"/><text x="222.3" y="122.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">формула квадрата разности</text><text x="120.2" y="146.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">≥</text><text x="126.2" y="146.0" font-size="14" text-anchor="start" fill="#111">0</text><line x1="214.3" y1="136.0" x2="214.3" y2="150.0" stroke="#993300" stroke-width="1"/><text x="222.3" y="145.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">квадрат неотрицателен</text><rect x="100.0" y="177.0" width="480.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="194.0" font-size="13" text-anchor="middle" fill="#111">Значит, a² + b² ≥ 2ab; равенство при a = b.</text></g></svg>