<svg xmlns="http://www.w3.org/2000/svg" width="680" height="227" viewBox="0 0 680 227" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="151.5" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="147.5" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Смешали 1 кг воды</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">при 80 °C и 3 кг при 20 °C</text><rect x="100.0" y="80.0" width="480.0" height="131.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="97.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="126.3" y="120.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="132.3" y="120.0" font-size="15" text-anchor="start" fill="#111">Qотд = Qпол</text><text x="126.3" y="144.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="132.3" y="144.0" font-size="15" text-anchor="start" fill="#111">c·1·(80 − t) = c·3·(t − 20)</text><line x1="292.6" y1="133.0" x2="292.6" y2="148.0" stroke="#993300" stroke-width="1"/><text x="300.6" y="143.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">c сокращается</text><text x="126.3" y="168.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="132.3" y="168.0" font-size="15" text-anchor="start" fill="#111">80 − t = 3t − 60</text><text x="126.3" y="192.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="132.3" y="192.0" font-size="15" text-anchor="start" fill="#111">t = 35 °C</text></g></svg>