<svg xmlns="http://www.w3.org/2000/svg" width="680" height="399" viewBox="0 0 680 399" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="152.8" y1="128.0" x2="152.8" y2="329.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="142.8" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="138.8" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Построение сечения</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">методом следов</text><line x1="152.8" y1="39.0" x2="207.2" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="152.8" y1="39.0" x2="152.8" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="285.6" height="46.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="152.8" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы построить сечение</text><text x="152.8" y="117.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">плоскостью MNK:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="142.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="140.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="160.0" font-size="14" text-anchor="start" fill="#111">1. Соединить точки, лежащие в одной грани.</text></g></g><line x1="152.8" y1="156.5" x2="168.8" y2="156.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="187.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="185.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="205.0" font-size="14" text-anchor="start" fill="#111">2. Продлить отрезок до пересечения с прямой основания — найти след.</text></g></g><line x1="152.8" y1="201.5" x2="168.8" y2="201.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="232.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="230.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="250.0" font-size="14" text-anchor="start" fill="#111">3. Через след провести прямую в плоскости основания.</text></g></g><line x1="152.8" y1="246.5" x2="168.8" y2="246.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="277.0" width="501.2" height="108.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="275.0" width="501.2" height="108.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="295.0" font-size="14" text-anchor="start" fill="#111">4. Соединить новые точки в гранях и обвести многоугольник.</text><rect x="176.8" y="311.0" width="485.2" height="64.0" rx="4" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/><text x="419.4" y="347.0" font-size="14" text-anchor="middle" font-style="italic" fill="#666">рисунок: куб, точки M, N, K на рёбрах</text></g></g><line x1="152.8" y1="329.0" x2="168.8" y2="329.0" stroke="#993300" stroke-width="1.5"/></g></svg>