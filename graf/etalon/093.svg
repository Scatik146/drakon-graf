 font-size="14" text-anchor="middle" font-weight="bold" fill="#111">i</text><rect x="244.6" y="0.0" width="250.0" height="28.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M361.6,28.0L369.6,67.0L377.6,28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="363.2" y1="28.0" x2="376.0" y2="28.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="369.6" y="17.0" font-size="13" text-anchor="middle" fill="#111">По определению i² = −1.</text><rect x="217.7" y="117.0" width="117.1" height="40.0" rx="20" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M309.3,117.0L315.3,90.0L321.3,117.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="310.5" y1="117.0" x2="320.1" y2="117.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="276.3" y="132.0" font-size="13" text-anchor="middle" fill="#111">действительная</text><text x="276.3" y="148.0" font-size="13" text-anchor="middle" fill="#111">часть</text><rect x="369.1" y="117.0" width="121.1" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M373.1,117.0L369.6,90.0L385.1,117.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="374.3" y1="117.0" x2="383.9" y2="117.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="429.6" y="132.0" font-size="13" text-anchor="middle" fill="#111">мнимая единица</text><rect x="299.7" y="165.0" width="103.4" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M345.4,165.0L351.4,90.0L357.4,165.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="346.6" y1="165.0" x2="356.2" y2="165.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="351.4" y="180.0" font-size="13" text-anchor="middle" fill="#111">мнимая часть</text></g></g><line x1="10.0" y1="303.0" x2="670.0" y2="303.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,311.0)"><path d="M10.0,11.0H146.0L160.0,26.0L146.0,41.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="29.0" font-size="13" text-anchor="middle" fill="#111">Что такое модуль</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="29.0" font-size="13" text-anchor="start" fill="#111">Это расстояние до начала координат: |z| = √(a² + b²).</text></g></g><rect x="640.0" y="13.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="29.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text></g></svg>