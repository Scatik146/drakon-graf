<svg xmlns="http://www.w3.org/2000/svg" width="680" height="416" viewBox="0 0 680 416" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="114.0" y1="114.0" x2="114.0" y2="235.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="40.0" rx="124.9" ry="30.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="40.0" rx="120.9" ry="27.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="35.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">Сравнение</text><text x="350.0" y="53.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">рациональных чисел</text><line x1="114.0" y1="40.0" x2="225.1" y2="40.0" stroke="#993300" stroke-width="1.5"/><line x1="114.0" y1="40.0" x2="114.0" y2="84.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="84.0" width="208.0" height="30.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="114.0" y="103.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">Чтобы сравнить два числа:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="132.0" y="128.0" width="540.0" height="34.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="130.0" y="126.0" width="540.0" height="34.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="138.0" y="147.0" font-size="15" text-anchor="start" fill="#111">1. Если знаки разные — больше положительное.</text></g></g><line x1="114.0" y1="143.0" x2="130.0" y2="143.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="132.0" y="174.0" width="540.0" height="34.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="130.0" y="172.0" width="540.0" height="34.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="138.0" y="193.0" font-size="15" text-anchor="start" fill="#111">2. Если оба положительные — больше то, у которого больше модуль.</text></g></g><line x1="114.0" y1="189.0" x2="130.0" y2="189.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="132.0" y="220.0" width="540.0" height="34.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="130.0" y="218.0" width="540.0" height="34.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="138.0" y="239.0" font-size="15" text-anchor="start" fill="#111">3. Если оба отрицательные — больше то, у которого меньше модуль.</text></g></g><rect x="290.0" y="272.0" width="360.0" height="54.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,272.0L410.0,253.0L406.0,272.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="272.0" x2="404.4" y2="272.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="290.0" font-size="15" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="313.0" font-size="15" text-anchor="middle" fill="#111">−3 &gt; −7, так как |−3| &lt; |−7|</text><rect x="290.0" y="346.0" width="360.0" height="54.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,346.0L410.0,327.0L406.0,346.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="346.0" x2="404.4" y2="346.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="364.0" font-size="15" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="470.0" y="387.0" font-size="15" text-anchor="middle" fill="#111">−3 &lt; −7 — сравнили модули, забыв про знак</text><line x1="114.0" y1="235.0" x2="130.0" y2="235.0" stroke="#993300" stroke-width="1.5"/></g></svg>