<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="152.8" y1="124.0" x2="152.8" y2="240.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="125.4" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="121.4" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Метод математической</text><text x="350.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">индукции</text><line x1="152.8" y1="38.0" x2="224.6" y2="38.0" stroke="#993300" stroke-width="1.5"/><line x1="152.8" y1="38.0" x2="152.8" y2="80.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="80.0" width="285.6" height="44.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="152.8" y="97.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Чтобы доказать P(n) для всех</text><text x="152.8" y="113.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">натуральных n:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="138.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="136.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="155.0" font-size="13" text-anchor="start" fill="#111">1. База: проверить P(1).</text></g></g><line x1="152.8" y1="152.0" x2="168.8" y2="152.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="182.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="180.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="199.0" font-size="13" text-anchor="start" fill="#111">2. Предположение: пусть P(k) верно.</text></g></g><line x1="152.8" y1="196.0" x2="168.8" y2="196.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="226.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="224.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="243.0" font-size="13" text-anchor="start" fill="#111">3. Переход: доказать P(k + 1), опираясь на P(k).</text></g></g><line x1="152.8" y1="240.0" x2="168.8" y2="240.0" stroke="#993300" stroke-width="1.5"/></g><line x1="10.0" y1="272.0" x2="670.0" y2="272.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,280.0)"><rect x="10.0" y="10.0" width="660.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="27.0" font-size="13" text-anchor="middle" fill="#111">Тогда P(n) верно при всех n — как падают костяшки домино</text><path d="M331,38V51H320L340,64L360,51H349V38" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="70.0" width="660.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="68.0" width="660.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="87.0" font-size="13" text-anchor="middle" fill="#111">Не забывать базу: без неё «доказывается» и ложное!</text></g></g></g></svg>