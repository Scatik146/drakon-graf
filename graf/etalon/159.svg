<svg xmlns="http://www.w3.org/2000/svg" width="680" height="402" viewBox="0 0 680 402" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="123.1" y1="108.0" x2="123.1" y2="268.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="135.7" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="131.7" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Метод доказательства</text><text x="350.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">от противного</text><line x1="123.1" y1="38.0" x2="214.3" y2="38.0" stroke="#993300" stroke-width="1.5"/><line x1="123.1" y1="38.0" x2="123.1" y2="80.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="80.0" width="226.3" height="28.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="123.1" y="97.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Чтобы доказать утверждение:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="141.1" y="122.0" width="530.9" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="139.1" y="120.0" width="530.9" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="147.1" y="139.0" font-size="13" text-anchor="start" fill="#111">1. Предположить, что верно обратное.</text></g></g><line x1="123.1" y1="136.0" x2="139.1" y2="136.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="141.1" y="166.0" width="530.9" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="139.1" y="164.0" width="530.9" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="147.1" y="183.0" font-size="13" text-anchor="start" fill="#111">2. Рассуждать, опираясь на это предположение.</text></g></g><line x1="123.1" y1="180.0" x2="139.1" y2="180.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="141.1" y="210.0" width="530.9" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="139.1" y="208.0" width="530.9" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="147.1" y="227.0" font-size="13" text-anchor="start" fill="#111">3. Прийти к противоречию с условием или известным фактом.</text></g></g><line x1="123.1" y1="224.0" x2="139.1" y2="224.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="141.1" y="254.0" width="530.9" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="139.1" y="252.0" width="530.9" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="147.1" y="271.0" font-size="13" text-anchor="start" fill="#111">4. Сделать вывод: предположение неверно, утверждение верно.</text></g></g><rect x="290.0" y="304.0" width="360.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,304.0L410.0,285.0L406.0,304.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="304.0" x2="404.4" y2="304.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="320.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="341.0" font-size="13" text-anchor="middle" fill="#111">Две прямые, параллельные третьей,</text><text x="470.0" y="357.0" font-size="13" text-anchor="middle" fill="#111">параллельны: иначе через точку прошли</text><text x="470.0" y="373.0" font-size="13" text-anchor="middle" fill="#111">бы две параллельные одной прямой</text><line x1="123.1" y1="268.0" x2="139.1" y2="268.0" stroke="#993300" stroke-width="1.5"/></g></svg>