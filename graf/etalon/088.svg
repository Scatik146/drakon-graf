<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="30.0" x2="14.0" y2="88.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Логарифм</text><line x1="14.0" y1="30.0" x2="240.0" y2="30.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,73.0H166.0L180.0,88.0L166.0,103.0H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="91.0" font-size="13" text-anchor="middle" fill="#111">Что такое логарифм</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="66.0" width="480.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="64.0" width="480.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="83.0" font-size="13" text-anchor="start" fill="#111">Это показатель степени, в которую надо</text><text x="198.0" y="99.0" font-size="13" text-anchor="start" fill="#111">возвести основание, чтобы получить число.</text></g></g><rect x="300.0" y="134.0" width="360.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M400.0,134.0L422.0,113.0L416.0,134.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="401.6" y1="134.0" x2="414.4" y2="134.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="480.0" y="150.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="480.0" y="171.0" font-size="13" text-anchor="middle" fill="#111">log₂ 8 = 3, так как 2³ = 8</text><line x1="14.0" y1="88.0" x2="30.0" y2="88.0" stroke="#993300" stroke-width="1.5"/></g><line x1="10.0" y1="200.0" x2="670.0" y2="200.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,208.0)"><g transform="translate(10.0,10.0)"><rect x="0.0" y="0.0" width="660.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><text x="283.7" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">log</text><rect x="303.8" y="9.0" width="15.9" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="311.8" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ₐ</text><text x="320.7" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="325.3" y="9.0" width="17.5" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="334.0" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">b</text><text x="343.8" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="347.3" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">=</text><text x="354.7" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="359.3" y="9.0" width="16.1" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="367.3" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">c</text><rect x="169.1" y="59.0" width="147.3" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M300.4,59.0L311.8,32.0L312.4,59.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="301.6" y1="59.0" x2="311.2" y2="59.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="242.8" y="74.0" font-size="13" text-anchor="middle" fill="#111">основание: a &gt; 0, a ≠ 1</text><rect x="353.0" y="59.0" width="82.6" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M361.3,59.0L367.3,32.0L373.3,59.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="362.5" y1="59.0" x2="372.1" y2="59.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="394.3" y="74.0" font-size="13" text-anchor="middle" fill="#111">показатель</text><rect x="290.7" y="91.0" width="86.8" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M328.0,91.0L334.0,32.0L340.0,91.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="329.2" y1="91.0" x2="338.8" y2="91.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="334.0" y="106.0" font-size="13" text-anchor="middle" fill="#111">число: b &gt; 0</text></g><rect x="10.0" y="141.0" width="660.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="158.0" font-size="13" text-anchor="middle" fill="#111">Значит:</text><path d="M331,169V182H320L340,195L360,182H349V169" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="201.0" width="660.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="199.0" width="660.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="218.0" font-size="13" text-anchor="middle" fill="#111">aᶜ = b</text></g></g></g></svg>