<svg xmlns="http://www.w3.org/2000/svg" width="680" height="337" viewBox="0 0 680 337" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Рекурсивная функция</text><g transform="translate(10.0,62.0)"><rect x="90.0" y="58.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="157.6" y="67.0" width="173.6" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="244.4" y="83.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">if n == 0: return 1</text><text x="332.2" y="83.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="336.1" y="83.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">·</text><text x="340.7" y="83.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="345.6" y="67.0" width="156.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="424.0" y="83.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">return n * f(n−1)</text><rect x="119.4" y="0.0" width="250.0" height="28.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M236.4,28.0L244.4,67.0L252.4,28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="238.0" y1="28.0" x2="250.8" y2="28.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="244.4" y="17.0" font-size="13" text-anchor="middle" fill="#111">Без базы рекурсия не остановится!</text><rect x="220.7" y="117.0" width="47.4" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M238.4,117.0L244.4,90.0L250.4,117.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="239.6" y1="117.0" x2="249.2" y2="117.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="244.4" y="132.0" font-size="13" text-anchor="middle" fill="#111">база</text><rect x="402.8" y="117.0" width="42.4" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M418.0,117.0L424.0,90.0L430.0,117.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="419.2" y1="117.0" x2="428.8" y2="117.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="424.0" y="132.0" font-size="13" text-anchor="middle" fill="#111">шаг</text></g></g><line x1="10.0" y1="223.0" x2="670.0" y2="223.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,231.0)"><rect x="18.0" y="18.0" width="181.6" height="70.0" rx="3" fill="#F6F3EA" stroke="#C9BFA6" stroke-width="1"/><text x="26.0" y="33.0" font-size="12" text-anchor="start" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">def f(n):</text><text x="26.0" y="48.0" font-size="12" text-anchor="start" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">    if n == 0:</text><text x="26.0" y="63.0" font-size="12" text-anchor="start" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">        return 1</text><text x="26.0" y="78.0" font-size="12" text-anchor="start" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">    return n * f(n - 1)</text></g></svg>