<svg xmlns="http://www.w3.org/2000/svg" width="680" height="382" viewBox="0 0 680 382" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="152.8" y1="111.0" x2="152.8" y2="312.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="131.3" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="127.3" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Построение сечения</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">методом следов</text><line x1="152.8" y1="39.0" x2="218.7" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="152.8" y1="39.0" x2="152.8" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="285.6" height="29.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="152.8" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы построить сечение плоскостью MNK:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="125.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="123.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="143.0" font-size="14" text-anchor="start" fill="#111">1. Соединить точки, лежащие в одной грани.</text></g></g><line x1="152.8" y1="139.5" x2="168.8" y2="139.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="170.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="168.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="188.0" font-size="14" text-anchor="start" fill="#111">2. Продлить отрезок до пересечения с прямой основания — найти след.</text></g></g><line x1="152.8" y1="184.5" x2="168.8" y2="184.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="215.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="213.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="233.0" font-size="14" text-anchor="start" fill="#111">3. Через след провести прямую в плоскости основания.</text></g></g><line x1="152.8" y1="229.5" x2="168.8" y2="229.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="260.0" width="501.2" height="108.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="258.0" width="501.2" height="108.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="278.0" font-size="14" text-anchor="start" fill="#111">4. Соединить новые точки в гранях и обвести многоугольник.</text><rect x="176.8" y="294.0" width="485.2" height="64.0" rx="4" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/><text x="419.4" y="330.0" font-size="14" text-anchor="middle" font-style="italic" fill="#666">рисунок: куб, точки M, N, K на рёбрах</text></g></g><line x1="152.8" y1="312.0" x2="168.8" y2="312.0" stroke="#993300" stroke-width="1.5"/></g></svg>