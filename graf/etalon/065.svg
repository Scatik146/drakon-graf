<svg xmlns="http://www.w3.org/2000/svg" width="680" height="307" viewBox="0 0 680 307" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="38.0" x2="14.0" y2="253.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="123.1" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="119.1" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Действия познающего</text><text x="350.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">человека</text><line x1="14.0" y1="38.0" x2="226.9" y2="38.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,89.0H166.0L180.0,112.0L166.0,135.0H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="107.0" font-size="13" text-anchor="middle" fill="#111">Обнаружение</text><text x="99.0" y="123.0" font-size="13" text-anchor="middle" fill="#111">сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="82.0" width="310.0" height="64.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="80.0" width="310.0" height="64.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="107.0" font-size="13" text-anchor="start" fill="#111">Это выделение действующего раздражителя</text><text x="198.0" y="123.0" font-size="13" text-anchor="start" fill="#111">из хаоса окружающего фона.</text></g></g><rect x="514.0" y="80.0" width="156.0" height="64.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,95.0L501.0,102.0L514.0,109.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="96.4" x2="514.0" y2="107.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="99.0" font-size="13" text-anchor="middle" fill="#111">— Тут что-то</text><text x="592.0" y="115.0" font-size="13" text-anchor="middle" fill="#111">есть! Но пока</text><text x="592.0" y="131.0" font-size="13" text-anchor="middle" fill="#111">не разберу что.</text><line x1="14.0" y1="112.0" x2="30.0" y2="112.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,165.0H166.0L180.0,180.0L166.0,195.0H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="183.0" font-size="13" text-anchor="middle" fill="#111">Различение сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="158.0" width="310.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="156.0" width="310.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="175.0" font-size="13" text-anchor="start" fill="#111">Это мысленное отделение одного сигнала</text><text x="198.0" y="191.0" font-size="13" text-anchor="start" fill="#111">от сходного с ним другого.</text></g></g><rect x="514.0" y="156.0" width="156.0" height="48.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,171.0L501.0,178.0L514.0,185.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="172.4" x2="514.0" y2="183.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="175.0" font-size="13" text-anchor="middle" fill="#111">— Это что-то более</text><text x="592.0" y="191.0" font-size="13" text-anchor="middle" fill="#111">тёмное и рыхлое.</text><line x1="14.0" y1="180.0" x2="30.0" y2="180.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,238.5H166.0L180.0,253.5L166.0,268.5H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="256.5" font-size="13" text-anchor="middle" fill="#111">Опознание сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="218.0" width="310.0" height="75.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="216.0" width="310.0" height="75.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="235.0" font-size="13" text-anchor="start" fill="#111">Это мысленное отнесение объекта</text><text x="198.0" y="251.0" font-size="13" text-anchor="start" fill="#111">к какой-либо группе объектов.</text><line x1="200.0" y1="268.0" x2="200.0" y2="282.0" stroke="#333" stroke-width="2"/><text x="208.0" y="278.0" font-size="13" text-anchor="start" fill="#111">Это мысленное раскладывание по полочкам.</text></g></g><rect x="514.0" y="229.5" width="156.0" height="48.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,244.5L501.0,251.5L514.0,258.5" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="245.9" x2="514.0" y2="257.1" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="248.5" font-size="13" text-anchor="middle" fill="#111">— Это какой-то порок</text><text x="592.0" y="264.5" font-size="13" text-anchor="middle" fill="#111">древесины!</text><line x1="14.0" y1="253.5" x2="30.0" y2="253.5" stroke="#993300" stroke-width="1.5"/></g></svg>