<svg xmlns="http://www.w3.org/2000/svg" width="680" height="204" viewBox="0 0 680 204" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Решите уравнение</text><rect x="100.0" y="62.0" width="480.0" height="126.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="78.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="125.4" y="100.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="131.4" y="100.0" font-size="14" text-anchor="start" fill="#111">3(x − 2) = x + 4</text><text x="125.4" y="123.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="131.4" y="123.0" font-size="14" text-anchor="start" fill="#111">3x − 6 = x + 4</text><line x1="233.9" y1="113.0" x2="233.9" y2="127.0" stroke="#993300" stroke-width="1"/><text x="241.9" y="122.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">раскрыли скобки</text><text x="125.4" y="146.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="146.0" font-size="14" text-anchor="start" fill="#111">2x = 10</text><line x1="233.9" y1="136.0" x2="233.9" y2="150.0" stroke="#993300" stroke-width="1"/><text x="241.9" y="145.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">перенесли с другим знаком</text><text x="125.4" y="169.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="169.0" font-size="14" text-anchor="start" fill="#111">x = 5</text><line x1="233.9" y1="159.0" x2="233.9" y2="173.0" stroke="#993300" stroke-width="1"/><text x="241.9" y="168.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">разделили на 2</text></g></svg>