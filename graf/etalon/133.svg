<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="110.0" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="106.0" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Докажите:</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">a² + b² ≥ 2ab</text><rect x="100.0" y="80.0" width="480.0" height="107.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="97.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="120.0" y="120.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="126.0" y="120.0" font-size="15" text-anchor="start" fill="#111">a² + b² − 2ab</text><text x="120.0" y="144.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="126.0" y="144.0" font-size="15" text-anchor="start" fill="#111">(a − b)²</text><line x1="217.0" y1="133.0" x2="217.0" y2="148.0" stroke="#993300" stroke-width="1"/><text x="225.0" y="143.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">формула квадрата разности</text><text x="120.0" y="168.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">≥</text><text x="126.0" y="168.0" font-size="15" text-anchor="start" fill="#111">0</text><line x1="217.0" y1="157.0" x2="217.0" y2="172.0" stroke="#993300" stroke-width="1"/><text x="225.0" y="167.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">квадрат неотрицателен</text><rect x="100.0" y="199.0" width="480.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="217.0" font-size="14" text-anchor="middle" fill="#111">Значит, a² + b² ≥ 2ab; равенство при a = b.</text></g></svg>