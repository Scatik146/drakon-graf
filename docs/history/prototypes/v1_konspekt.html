<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конспект: прототип</title>
<style>
  :root{--bg:#f4f1ea;--panel:#fff;--ink:#222;--muted:#6b6457;--acc:#993300}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",Arial,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:#fff;border-bottom:2px solid var(--acc)}
  header b{color:var(--acc);font-size:16px}
  header label{display:flex;gap:6px;align-items:center;color:var(--muted)}
  select,input,button{font:inherit}
  button{border:1px solid var(--acc);background:#fff7e0;color:var(--acc);border-radius:6px;padding:3px 10px;cursor:pointer}
  main{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:12px;padding:12px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  textarea{width:100%;height:calc(100vh - 110px);min-height:300px;font:13px/1.45 Consolas,"Courier New",monospace;padding:10px;border:1px solid #ccc;border-radius:6px;resize:vertical;tab-size:2}
  #out{background:var(--panel);border:1px solid #ddd;border-radius:6px;padding:12px;overflow:auto}
  #warn{margin-top:10px;font-size:13px}
  #warn div{padding:4px 8px;border-left:3px solid #d08000;background:#fff8e6;margin:3px 0}
  #warn div.ok{border-color:#4a9a4a;background:#effaef}
  #meta{color:var(--muted);font-size:12px;margin-bottom:6px}
  svg .memo-t{transition:opacity .2s}
  svg.selfcheck .memo-t{opacity:0}
  svg.selfcheck .memo.open .memo-t{opacity:1}
  svg.selfcheck .memo{cursor:pointer}
  svg.blind text{display:none}
</style>
</head>
<body>
<header>
  <b>Конспект: ГНОМ · ГРАФ · МОЛНИЯ</b>
  <label>Пример <select id="ex"></select></label>
  <label>Ширина <input id="w" type="range" min="420" max="900" value="680"></label>
  <label><input id="sc" type="checkbox"> Самопроверка</label>
  <label><input id="bl" type="checkbox"> Слепыш</label>
  <button id="dl">Скачать SVG</button>
</header>
<main>
  <textarea id="src" spellcheck="false"></textarea>
  <section>
    <div id="out"><div id="meta"></div><div id="pic"></div></div>
    <div id="warn"></div>
  </section>
</main>
<script>
"use strict";
/* ============ общие средства рисования ============ */
const C={line:'#993300',fill:'#FFFF99',orange:'#FFCC66',mark:'#CC6600',tie:'#FF9933',
  mbg:'#8FD3F5',mbox:'#D4EEFB',mink:'#1d1d1d',mcall:'#FFFF99',mcallb:'#8A6D00'};
const FS=13, LH=16, FONT=FS+'px Arial, Helvetica, sans-serif';
const cx2d=document.createElement('canvas').getContext('2d');
function tw(t,bold,size){cx2d.font=(bold?'bold ':'')+(size||FS)+'px Arial, Helvetica, sans-serif';return cx2d.measureText(t).width;}
function pretty(s){ // «невидимая математика» для прототипа; в программе — KaTeX
  return String(s).replace(/\$([^$]+)\$/g,(m,f)=>f.replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/sqrt/g,'√')
   .replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠').replace(/\*/g,'·').replace(/pi/g,'π'));
}
function wrap(text,maxW,bold,size){
  const words=pretty(text).split(/\s+/).filter(Boolean);const out=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(tw(t,bold,size)<=maxW||!cur)cur=t;else{out.push(cur);cur=w;}}
  if(cur)out.push(cur);return out.length?out:[''];
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function txt(lines,x,y,o={}){ // y — верх первой строки
  const a=o.anchor||'start',sz=o.size||FS,lh=o.lh||LH;
  return lines.map((l,i)=>`<text x="${x.toFixed(1)}" y="${(y+i*lh+sz-2).toFixed(1)}" font-size="${sz}" text-anchor="${a}"${o.bold?' font-weight="bold"':''}${o.italic?' font-style="italic"':''} fill="${o.fill||'#111'}">${esc(l)}</text>`).join('');
}
const L=(x1,y1,x2,y2,c,w)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c||C.line}" stroke-width="${w||1.5}"/>`;
const rect=(x,y,w,h,f,s,rx,sw)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx||0}" fill="${f}" stroke="${s||C.line}" stroke-width="${sw||1.5}"/>`;
function memoRect(x,y,w,h){return rect(x+2,y+2,w,h,C.line,C.line)+rect(x,y,w,h,C.fill);}
function pointerPath(x,y,w,h,f,s){const d=Math.min(14,h/2);return `<path d="M${x},${y}H${x+w-d}L${x+w},${y+h/2}L${x+w-d},${y+h}H${x}Z" fill="${f||C.fill}" stroke="${s||C.line}" stroke-width="1.5"/>`;}
function counterPath(x,y,w,h){const d=Math.min(14,h/2);return `<path d="M${x+d},${y}H${x+w}V${y+h}H${x+d}L${x},${y+h/2}Z" fill="${C.fill}" stroke="${C.line}" stroke-width="1.5"/>`;}
function headerEllipse(x,y,w,h){const cx=x+w/2,cy=y+h/2;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${h/2}" fill="${C.fill}" stroke="${C.line}" stroke-width="1.5"/><ellipse cx="${cx}" cy="${cy}" rx="${w/2-4}" ry="${h/2-3}" fill="none" stroke="${C.line}" stroke-width="1.2"/>`;}
function ellY(x,ex,ey,ew,eh,bottom){const cx=ex+ew/2,cy=ey+eh/2,rx=ew/2,ry=eh/2;const k=Math.max(0,1-((x-cx)/rx)**2);return cy+(bottom?1:-1)*ry*Math.sqrt(k);}
// клин выноски: основание на кромке выноски, остриё в цели
function wedge(b1x,b1y,b2x,b2y,ax,ay,f,s){
  return `<path d="M${b1x},${b1y}L${ax},${ay}L${b2x},${b2y}" fill="${f}" stroke="${s}" stroke-width="1.2"/>`+L(b1x+(b2x-b1x)*0.08,b1y+(b2y-b1y)*0.08,b2x-(b2x-b1x)*0.08,b2y-(b2y-b1y)*0.08,f,2.6);
}
function blockArrow(cx,y,w,h,up,f,s){ // фигурная стрелка
  const sw=w*0.45,hh=h*0.5;
  if(up) return `<path d="M${cx-sw/2},${y+h}V${y+hh}H${cx-w/2}L${cx},${y}L${cx+w/2},${y+hh}H${cx+sw/2}V${y+h}" fill="${f||C.fill}" stroke="${s||C.line}" stroke-width="1.5"/>`;
  return `<path d="M${cx-sw/2},${y}V${y+hh}H${cx-w/2}L${cx},${y+h}L${cx+w/2},${y+hh}H${cx+sw/2}V${y}" fill="${f||C.fill}" stroke="${s||C.line}" stroke-width="1.5"/>`;
}

/* ============ разбор текста блока «конспект» ============ */
const OPT=/^(схема|ширина|профиль|начать с|нумерация|класс)\s*[:=]\s*(.+)$/i;
const KINDS='теорема|свойство|признак|следствие|формула|аксиома|алгоритм|правило|закон|метод';
function lowerFirst(s){return s.length>1&&/[а-яёa-z]/.test(s[1])?s[0].toLowerCase()+s.slice(1):s;}
function classify(t){
  let m;
  if(m=t.match(OPT))return{kind:'opt',key:m[1].toLowerCase(),val:m[2].trim()};
  if(m=t.match(/^тема\s*:\s*(.*)$/i))return{kind:'header',text:m[1]};
  if(m=t.match(/^связка\s*:\s*(.*)$/i))return{kind:'link',parts:m[1].split('|').map(s=>s.trim())};
  if(m=t.match(/^двойная\s+стрелка\s*:\s*(.*)$/i))return{kind:'arrow2',text:m[1]};
  if(m=t.match(/^стрелка\s*:\s*(.*)$/i))return{kind:'arrow',text:m[1]};
  if(m=t.match(/^(выноска|пример|уточнение|пояснение)(?:\s+(снизу|справа))?\s*:\s*(.*)$/i))
    return{kind:'callout',title:/пример/i.test(m[1])?'Пример':'',square:/уточнение/i.test(m[1]),pos:(m[2]||'').toLowerCase(),text:m[3]};
  if(t.includes('><')){const [a,b]=t.split('><');return{kind:'pair',left:a.trim(),right:(b||'').trim()};}
  if(m=t.match(/^(?:[-–]\s+)?(.*?)\s*(?:->|→)\s*(.*)$/)){
    let left=m[1].trim(),def=false,mm;
    if(mm=left.match(/^(?:опр|определение)\s*:\s*(.+)$/i)){def=true;const term=mm[1].trim();
      left=term.split(/\s+/).length<=2?'Что такое '+lowerFirst(term):term;}
    else if(mm=left.match(new RegExp('^('+KINDS+')\\s*:\\s*(.+)$','i'))){left=mm[1][0].toUpperCase()+mm[1].slice(1).toLowerCase()+' '+mm[2].trim();}
    return{kind:'memo',pointer:left,text:m[2].trim(),def};
  }
  if(m=t.match(/^[-–]\s+(.*)$/))return{kind:'item',text:m[1]};
  if(m=t.match(/^[*•]\s+(.*)$/))return{kind:'marker',text:m[1]};
  if(m=t.match(/^\|\s?(.*)$/))return{kind:'bar',text:m[1]};
  if(m=t.match(/^\}\s*(.*)$/))return{kind:'brace',text:m[1]};
  if(m=t.match(/^\$\$(.*)\$\$$/))return{kind:'formula',text:m[1]};
  return{kind:'text',text:t};
}
function parse(src){
  const root={kind:'root',children:[],indent:-1},stack=[root],opts={};
  for(const raw of src.replace(/\t/g,'    ').split('\n')){
    if(/^\s*#/.test(raw))continue;
    const t=raw.trim();
    if(!t){const top=stack[stack.length-1];if(top!==root)top.children.push({kind:'blank',children:[]});continue;}
    const ind=raw.match(/^ */)[0].length;
    while(stack[stack.length-1].indent>=ind)stack.pop();
    const n=classify(t);n.indent=ind;n.children=[];
    if(n.kind==='opt'){opts[n.key]=n.val;continue;}
    stack[stack.length-1].children.push(n);stack.push(n);
  }
  // текст/пункт с детьми-пунктами = группа
  // пустая строка «><» между двумя списками маркеров = пара списков
  {const k=root.children,out=[];for(let i=0;i<k.length;i++){const c=k[i];
    if(c.kind==='pair'&&!c.left&&!c.right&&!c.children.length){const lz=[];while(out.length&&out[out.length-1].kind==='marker')lz.unshift(out.pop());
      const rz=[];while(i+1<k.length&&k[i+1].kind==='marker')rz.push(k[++i]);
      c.lz=lz.map(m=>({t:'m',text:m.text}));c.rz=rz.map(m=>({t:'m',text:m.text}));}
    out.push(c);}root.children=out;}
  (function fix(node,depth){for(const c of node.children){fix(c,depth+1);
    if((c.kind==='text'||c.kind==='item')&&c.children.some(k=>['item','text','group'].includes(k.kind)))c.kind='group';
    else if(c.kind==='text'&&node.kind==='root')c.kind='item';}})(root,0);
  return{root,opts};
}
// содержимое мнемоблока
function content(node){
  const z=[];if(node.text)z.push({t:'p',text:node.text});
  let gap=false;
  for(const c of node.children){
    if(c.kind==='blank'){gap=true;continue;}
    if(c.kind==='text'){const last=z[z.length-1];if(last&&last.t==='p'&&!gap)last.text+=' '+c.text;else z.push({t:'p',text:c.text,gap});}
    else if(c.kind==='marker'||c.kind==='item')z.push({t:'m',text:c.text,gap});
    else if(c.kind==='bar')z.push({t:'bar',text:c.text,gap});
    else if(c.kind==='formula')z.push({t:'f',text:c.text,gap});
    else if(c.kind==='brace'){const items=[];while(z.length&&z[z.length-1].t==='m')items.unshift(z.pop());z.push({t:'brace',items,text:c.text,gap});}
    gap=false;
  }
  return z;
}
/* мнемоблок с богатым содержимым */
function rich(z,w,o={}){
  const P=8,parts=[];let h=P;
  const iw=w-2*P-(o.padL||0)-(o.padR||0),x0=P+(o.padL||0);
  const add=(f,hh)=>{const off=h;parts.push((x,y)=>f(x,y+off));h+=hh+4;};
  for(const it of z){
    if(it.gap)h+=6;
    if(it.t==='p'){const ls=wrap(it.text,iw,o.bold);add((x,y)=>txt(ls,x+x0+(o.center?iw/2:0),y,{anchor:o.center?'middle':'start',bold:o.bold}),ls.length*LH);}
    else if(it.t==='m'){const ls=wrap(it.text,iw-14);add((x,y)=>`<circle cx="${x+x0+4}" cy="${y+7}" r="4.2" fill="${C.mark}"/>`+txt(ls,x+x0+14,y),ls.length*LH);}
    else if(it.t==='bar'){const ls=wrap(it.text,iw-12);const hh=ls.length*LH;add((x,y)=>L(x+x0+2,y+1,x+x0+2,y+hh-1,'#333',2)+txt(ls,x+x0+10,y),hh);}
    else if(it.t==='f'){const ls=wrap('$'+it.text+'$',iw-20,true,15);const hh=ls.length*19+14;add((x,y)=>rect(x+x0,y,iw,hh,'#fff',C.line,0,2)+txt(ls,x+x0+iw/2,y+7,{anchor:'middle',bold:true,size:15,lh:19}),hh);}
    else if(it.t==='brace'){const lw=iw*0.55;let hh=0;const rows=it.items.map(m=>{const ls=wrap(m.text,lw-14);const r={ls,y:hh};hh+=ls.length*LH;return r;});
      const rl=wrap(it.text,iw-lw-22);hh=Math.max(hh,rl.length*LH);
      add((x,yy)=>{const bx=x+x0+lw+2;let s=rows.map(r=>`<circle cx="${x+x0+4}" cy="${yy+r.y+7}" r="4.2" fill="${C.mark}"/>`+txt(r.ls,x+x0+14,yy+r.y)).join('');
        const y1=yy+1,y2=yy+hh-1,ym=(y1+y2)/2;
        s+=`<path d="M${bx},${y1}q6,0 6,6V${ym-5}q0,5 6,5q-6,0 -6,5V${y2-6}q0,6 -6,6" fill="none" stroke="#333" stroke-width="1.3"/>`;
        return s+txt(rl,bx+16,ym-rl.length*LH/2);},hh);}
  }
  h+=P-4;
  return{h:Math.max(h,o.minH||0),svg:(x,y,hh)=>{const dy=hh?(hh-h)/2:0;return parts.map(p=>p(x,y+dy)).join('');}};
}
/* запоминатель: указатель + мнемоблок (+номер, +выноски) */
function memoEl(node,W,o={}){
  const pw=o.pw||150,numW=o.num?40:0;
  const callouts=node.children.filter(c=>c.kind==='callout');
  const right=callouts.filter(c=>c.pos==='справа'||(!c.pos&&o.cr&&(c.text.length<=70||c.title)));
  const below=callouts.filter(c=>!right.includes(c));
  const crW=o.cr?170:0;
  const mw=W-pw-10-numW-crW;
  const pl=wrap(node.pointer,pw-26);const pH=pl.length*LH+14;
  const r=rich(content(node),mw);const h=Math.max(pH,r.h,30);
  const rcs=right.map(c=>calloutEl(c,crW-14));
  const bcs=below.map(c=>calloutEl(c,Math.min(mw*0.8,320)));
  const bh=bcs.reduce((s,c)=>s+c.h+22,0);
  return{h:h+bh,cy:h/2,svg:(x,y)=>{
    let s=pointerPath(x,y+(h-pH)/2,pw,pH)+txt(pl,x+(pw-12)/2,y+(h-pH)/2+7,{anchor:'middle'});
    s+=`<g class="memo" onclick="this.classList.toggle('open')">`+memoRect(x+pw+10,y,mw,h)+`<g class="memo-t">`+r.svg(x+pw+10,y,h)+`</g></g>`;
    if(o.num)s+=rect(x+W-numW+10,y+h/2-13,26,26,C.fill)+txt([String(o.num)],x+W-numW+23,y+h/2-8,{anchor:'middle',bold:true});
    let cy=y;rcs.forEach(c=>{const cx=x+pw+10+mw+14;const yy=y+Math.max(0,(h-c.h)/2);s+=c.svg(cx,yy,{side:'left',tx:x+pw+10+mw,ty:y+h/2});cy+=c.h;});
    let by=y+h+22;bcs.forEach(c=>{const cx=x+pw+10+mw-c.w-10;s+=c.svg(cx,by,{side:'top',tx:cx+c.w*0.35,ty:y+h-1});by+=c.h+22;});
    return s;}};
}
function calloutEl(c,w){
  const z=content(c);const r=rich(z,w,{center:!z.some(q=>q.t==='m')&&!c.title});
  const th=c.title?LH+4:0;const h=r.h+th;
  return{w,h,svg:(x,y,t)=>{
    let s='';const rx=c.square?0:10;
    s+=rect(x,y,w,h,C.fill,C.line,rx,1.2);
    if(t){if(t.side==='left'){const by=y+h/2;s+=wedge(x,by-7,x,by+7,t.tx+1,t.ty,C.fill,C.line);}
      else{const bx=x+w*0.35;s+=wedge(bx-8,y,bx+8,y,t.tx,t.ty,C.fill,C.line);}}
    if(c.title)s+=txt([c.title],x+w/2,y+6,{anchor:'middle',italic:true});
    return s+r.svg(x,y+th);}};
}
function boxEl(text,w,o={}){ // простой мнемоблок/связка с текстом по центру
  const ls=wrap(text,w-16,o.bold);const h=Math.max(ls.length*LH+12,o.minH||0);
  return{w,h,svg:(x,y,hh)=>{const H=hh||h;let s='';
    if(o.shape==='round')s+=rect(x,y,w,H,o.fill||C.orange,C.line,Math.min(12,H/2));
    else if(o.shape==='plain')s+=rect(x,y,w,H,C.fill);
    else s+=memoRect(x,y,w,H);
    return s+txt(ls,x+w/2,y+(H-ls.length*LH)/2,{anchor:'middle',bold:o.bold});}};
}
function itemEl(node,w){ // мнемоблок без указателя (лестница)
  const r=rich(content(node),w);const callouts=node.children.filter(c=>c.kind==='callout');
  const cs=callouts.map(c=>calloutEl(c,Math.min(w*0.6,300)));const bh=cs.reduce((s,c)=>s+c.h+20,0);
  return{h:r.h+bh,cy:r.h/2,svg:(x,y)=>{let s=`<g class="memo" onclick="this.classList.toggle('open')">`+memoRect(x,y,w,r.h)+`<g class="memo-t">`+r.svg(x,y)+`</g></g>`;
    let by=y+r.h+20;cs.forEach(c=>{const cx=x+w-c.w-20;s+=c.svg(cx,by,{side:'top',tx:cx+c.w*0.35,ty:y+r.h-1});by+=c.h+20;});return s;}};
}
function headerEl(text,maxW){
  const w0=Math.min(maxW,Math.max(220,tw(pretty(text),true)*0.75+90));
  const ls=wrap(text,w0-70,true);const h=ls.length*LH+24;
  return{w:w0,h,svg:(x,y)=>headerEllipse(x,y,w0,h)+txt(ls,x+w0/2,y+12,{anchor:'middle',bold:true})};
}

/* ============ выбор схемы ============ */
function chooseScheme(root,opts){
  const k=root.children;const cnt=t=>k.filter(c=>c.kind===t).length;
  if(opts['схема'])return opts['схема'].toLowerCase().replace('ё','е');
  const H=cnt('header'),P=cnt('pair'),Z=cnt('memo'),M=cnt('item'),G=cnt('group'),S=cnt('link');
  if((opts['профиль']||'').toLowerCase()==='гном'||(!H&&Z&&!M&&!G))return 'гном';
  if(H>=2)return 'двуглавый змей';
  if(P)return P>1?'очная ставка многоэтажная':(S?'очная ставка со связкой':'очная ставка');
  if(Z)return 'батарея';
  if(G){
    const deep=k.some(g=>g.kind==='group'&&g.children.some(c=>c.kind==='group'));
    if(deep)return 'дерево';
    if(M)return 'лестница с гребенкой';
    return 'эполеты';
  }
  const items=k.filter(c=>c.kind==='item');const n=items.length;
  const plain=items.every(i=>!i.children.some(c=>c.kind!=='callout'&&c.kind!=='blank'));
  const maxLen=Math.max(0,...items.map(i=>pretty(i.text).length));
  const W=+(opts['ширина']||opts.__W||680);
  const natural=items.reduce((s,i)=>s+Math.min(150,Math.max(64,tw(pretty(i.text))+22)),0)+(n-1)*12;
  if(S)return (n>=5&&maxLen<=60&&plain)?'гребенка со связкой':'лестница со связкой';
  if(plain&&maxLen<=32){if(natural<=W-20)return 'линейка';if(n<=12)return 'шахматы';return 'гребенка';}
  if(plain&&n>=8&&maxLen<=60)return 'гребенка';
  return 'лестница';
}

/* ============ раскладки схем ============ */
const M0=10;
function layGnom(root,W,opts){
  let y=M0,s='';let n=parseInt(opts['начать с']||'1');const num=(opts['нумерация']||'да')!=='нет';
  const cr=root.children.some(c=>c.kind==='memo'&&c.children.some(q=>q.kind==='callout'&&q.pos!=='снизу'));

function parseMolniya(src){

    else if(m=t.match(/^почему\s*:\s*(.*)$/i))items.push({k:'why',text:m[1]});

    else if(it.k==='why'){const bw=Math.min(240,iw*0.45);const ls=wrap(it.text,bw-16);const h=ls.length*LH+12;const x=W-P-bw-30;
      s+=rect(x,y,bw,h,C.mcall,C.mcallb,0,1.2)+txt(ls,x+bw/2,y+6,{anchor:'middle'});s+=blockArrow(x+bw/2,y+h,40,26,false,C.mcall,C.mcallb);y+=h+26;}
    else if(it.k==='concl'){const bw=Math.min(iw*0.7,360);const ls=wrap(it.text,bw-20,true);const h=ls.length*LH+14;const x=W-P-bw-30+Math.min(0,(Math.min(240,iw*0.45)-bw)/2);
      s+=rect(x,y,bw,h,'#fff',C.mink,0,1.6)+txt(ls,x+bw/2,y+7,{anchor:'middle',bold:true});y+=h+14;}
  }
  function drawExample(text,rules,mdeps,y0){
    const toks=sentenceTokens(text);const fs=14,lh=28,pad=16;let svg='';
    // раскладка предложения потоком
    const maxW=iw-2*pad;let lines=[[]],cw=0;const segs=[];
    const add=(piece)=>{if(cw+piece.w>maxW&&cw>0){lines.push([]);cw=0;if(piece.t==='txt'&&!piece.text.trim())return;}piece.x=cw;lines[lines.length-1].push(piece);cw+=piece.w;};
    for(const t of toks){
      if(t.t==='txt'){t.text.split(/(\s+)/).filter(x=>x!=='').forEach(w=>add({t:'txt',text:w,w:tw(pretty(w),true,fs)}));}
      else{const w=tw(pretty(t.text),true,fs)+(t.text.trim().length<=2?12:18);const seg={...t,w};segs.push(seg);add(seg);}
    }
    const lineW=lines.map(l=>l.reduce((s,p)=>s+p.w,0));const boxW=Math.min(iw,Math.max(...lineW)+2*pad+10,iw);const bx=(W-boxW)/2;
    // правила сверху
    const findSeg=n=>segs.find(g=>g.label.toLowerCase()===n.toLowerCase())||segs.find(g=>g.text.trim()===n)||segs.find(g=>g.text.includes(n));
    let y=y0;
    const ruleW=rules.length?Math.min(250,(iw-(rules.length-1)*12)/rules.length):0;
    const rl=rules.map(r=>{const ls=wrap(r.text,ruleW-16);return{r,ls,h:ls.length*LH+12};});
    const rh=rl.length?Math.max(...rl.map(q=>q.h)):0;
    const topLabels=segs.filter(g=>g.above&&g.label);
    const tlH=topLabels.length?30:0;const depH=mdeps.length?34:0;
    const gapAbove=rules.length?38:10;
    const boxY=y+rh+(rh?gapAbove:0)+tlH+depH;
    const boxH=lines.length*lh+14;
    // позиции сегментов
    lines.forEach((ln,li)=>{const lx=bx+pad+5+(boxW-2*pad-10-lineW[li])/2;ln.forEach(p=>{p.ax=lx+p.x;p.ay=boxY+7+li*lh;});});
    svg+=rect(bx,boxY,boxW,boxH,C.mbox,C.mink,0,1.8);
    lines.forEach(ln=>ln.forEach(p=>{
      if(p.t==='txt')svg+=txt([pretty(p.text)],p.ax,p.ay+5,{bold:true,size:fs});
      else{svg+=rect(p.ax+1,p.ay+1,p.w-2,lh-6,'#fff',C.mink,11,1.2)+txt([pretty(p.text)],p.ax+p.w/2,p.ay+5,{anchor:'middle',bold:true,size:fs});}
    }));
    // правила: раскладка над целями
    let cursor=P;const placed=[];
    rl.forEach(q=>{const tg=q.r.targets.map(findSeg).filter(Boolean);if(q.r.targets.length&&tg.length<q.r.targets.length)warns.push('Правило не нашло цель: '+q.r.targets.join(', '));
      const want=tg.length?tg.reduce((s,g)=>s+g.ax+g.w/2,0)/tg.length-ruleW/2:cursor;let x=Math.max(cursor,Math.min(want,W-P-ruleW));placed.push({q,x,tg});cursor=x+ruleW+12;});
    // если вылезли за край — сдвигаем всё влево
    const over=cursor-12-(W-P);if(over>0)placed.forEach(p=>p.x=Math.max(P,p.x-over));
    placed.forEach(({q,x,tg})=>{const ry=y+(rh-q.h);
      tg.forEach(g=>{const bx0=Math.max(x+12,Math.min(x+ruleW-28,g.ax+g.w/2-8));svg+=`<path d="M${bx0},${ry+q.h-1}L${g.ax+g.w/2},${g.ay+1}L${bx0+16},${ry+q.h-1}" fill="${C.mcall}" stroke="${C.mcallb}" stroke-width="1.1"/>`;});
      svg+=rect(x,ry,ruleW,q.h,C.mcall,C.mcallb,10,1.2);
      tg.forEach(g=>{const bx0=Math.max(x+12,Math.min(x+ruleW-28,g.ax+g.w/2-8));svg+=L(bx0+1.5,ry+q.h-0.6,bx0+14.5,ry+q.h-0.6,C.mcall,2.4);});
      svg+=txt(q.ls,x+ruleW/2,ry+6,{anchor:'middle'});});
    // ломаные стрелки (вопрос от главного слова к зависимому)
    mdeps.forEach((d,i)=>{const A=findSeg(d.a),B=findSeg(d.b);if(!A||!B){warns.push('Связь не нашла слова: '+d.a+' → '+d.b);return;}
      const ax=A.ax+A.w/2,bxx=B.ax+B.w/2,top=boxY-depH+6+i*0;const yA=A.ay;const yB=B.ay;
      svg+=`<path d="M${ax},${yA}V${top}H${bxx}V${yB-4}" fill="none" stroke="#444" stroke-width="2"/><path d="M${bxx-5},${yB-10}L${bxx},${yB-1}L${bxx+5},${yB-10}Z" fill="#444"/>`;
      const lw=tw(d.text)+22,mx=(ax+bxx)/2;svg+=rect(mx-lw/2,top-10,lw,20,C.mcall,C.mcallb,10,1.1)+txt([d.text],mx,top-8,{anchor:'middle'});});
    // подписи сверху
    let tc=P;topLabels.forEach(g=>{const c=ellCall(g.label,150);let x=Math.max(tc,g.ax+g.w/2-c.w/2);tc=x+c.w+8;const yy=boxY-depH-tlH+2;
      svg+=`<ellipse cx="${x+c.w/2}" cy="${yy+c.h/2-3}" rx="${c.w/2}" ry="${c.h/2-2}" fill="${C.mcall}" stroke="${C.mcallb}" stroke-width="1.1"/>`+txt(c.ls,x+c.w/2,yy+3,{anchor:'middle'});});
    // подписи снизу: ряды без наложений
    let by=boxY+boxH+34;const bl=segs.filter(g=>!g.above&&g.label).map(g=>({g,c:ellCall(g.label,150),t:g.ax+g.w/2}));
    const spread=(arr)=>{arr.sort((p,q)=>p.t-q.t);arr.forEach(o=>o.x=o.t-o.c.w/2);
      for(let i=0;i<arr.length;i++)arr[i].x=Math.max(arr[i].x,P,i?arr[i-1].x+arr[i-1].c.w+6:P);
      for(let i=arr.length-1;i>=0;i--)arr[i].x=Math.min(arr[i].x,i<arr.length-1?arr[i+1].x-arr[i].c.w-6:W-P-arr[i].c.w);
      return arr.every((o,i)=>o.x>=P-0.5&&(!i||o.x>=arr[i-1].x+arr[i-1].c.w+5));};
    const fits=bl.reduce((s0,o)=>s0+o.c.w+6,0)<=iw;
    if(fits){spread(bl);bl.forEach(o=>o.r=0);}
    else{bl.sort((p,q)=>p.t-q.t);const r0=bl.filter((_,i)=>i%2===0),r1=bl.filter((_,i)=>i%2===1);spread(r0);spread(r1);r0.forEach(o=>o.r=0);r1.forEach(o=>o.r=1);}
    const rowH=Math.max(30,...bl.map(o=>o.c.h))+10;
    const geo=bl.map(o=>{const yy=by+o.r*rowH;const tx=o.t,ty=o.g.ay+lh-6;
      const bx1=Math.max(o.x+o.c.w*0.2,Math.min(o.x+o.c.w*0.8-12,tx-6));const ey=ellY(bx1+6,o.x,yy,o.c.w,o.c.h,false);return{o,yy,tx,ty,bx1,ey};});
    geo.forEach(q=>svg+=`<path d="M${q.bx1},${q.ey+3}L${q.tx},${q.ty}L${q.bx1+12},${q.ey+3}" fill="${C.mcall}" stroke="${C.mcallb}" stroke-width="1.1"/>`);
    geo.forEach(q=>{const o=q.o;svg+=`<ellipse cx="${o.x+o.c.w/2}" cy="${q.yy+o.c.h/2}" rx="${o.c.w/2}" ry="${o.c.h/2}" fill="${C.mcall}" stroke="${C.mcallb}" stroke-width="1.1"/>`;});
    geo.forEach(q=>{const o=q.o;const yt=q.ey-3,f=(yt-(q.ey+3))/(q.ty-(q.ey+3));

      svg+=`<path d="M${q.bx1+1.4},${q.ey+4}L${xl},${yt}L${xr},${yt}L${q.bx1+10.6},${q.ey+4}Z" fill="${C.mcall}"/>`+txt(o.c.ls,o.x+o.c.w/2,q.yy+6,{anchor:'middle'});});
    const nRows=bl.length?Math.max(...bl.map(o=>o.r))+1:0;
    const yEnd=bl.length?by+nRows*rowH+4:boxY+boxH+16;
    return{svg,y:yEnd};
  }
  const body=s;const H=y+P;
  return{h:H,svg:rect(0,0,W,H,C.mbg,'none',0,0)+body,warns};
}

/* ============ проверки по правилам Паронджанова ============ */
function lint(root,scheme,opts){
  const w=[];const cls=parseInt(opts['класс']||'10');const maxWords=cls<=4?8:cls<=7?10:cls<=9?12:15;
  const sentences=t=>String(t).replace(/\$[^$]*\$/g,'Ф').split(/(?<=[.!?])\s+/).filter(s=>s.trim());
  (function walk(n){for(const c of n.children){
    const texts=[c.text,c.pointer,c.left,c.right].filter(Boolean);
    texts.forEach(t=>sentences(t).forEach(s=>{const k=s.split(/\s+/).length;if(k>maxWords)w.push(`Длинное предложение (${k} слов при норме до ${maxWords} для ${cls} кл.): «${s.slice(0,60)}…»`);}));
    if(c.kind==='memo'&&c.def&&c.text&&!/^это(\s|$)/i.test(c.text))w.push(`Определение «${c.pointer}» лучше начинать со слова «Это…» (ГНОМ, правило 2).`);
    if(c.kind==='memo'&&/^что такое/i.test(c.pointer)&&c.pointer.split(/\s+/).length>4)w.push(`«Что такое…» ставят только перед терминами из 1–2 слов (ГНОМ, правило 8): «${c.pointer}».`);
    if((c.kind==='memo'||c.kind==='item')&&c.text&&sentences(c.text).length>=3&&!c.children.some(q=>q.kind==='marker'))w.push(`В блоке «${(c.pointer||c.text).slice(0,40)}» три и больше мыслей — разбейте на зоны с маркерами (ГНОМ, правило 3).`);
    if(c.kind==='pair'&&!c.lz&&(!c.left||!c.right))w.push('В очной ставке у пары нет второй половины.');
    walk(c);}})(root);
  const items=root.children.filter(c=>c.kind==='item').length;
  if(scheme==='линейка'&&items>7)w.push('В линейке больше 7 элементов — лучше «Шахматы» или «Гребенка».');
  if(!root.children.some(c=>c.kind==='header')&&!['гном'].includes(scheme))w.push('Нет строки «тема:» — заголовок схемы.');
  return w;
}

/* ============ сборка ============ */
function render(src,W){
  const first=src.split('\n').find(l=>l.trim()&&!l.trim().startsWith('#'))||'';
  if(/^профиль\s*[:=]\s*молния/i.test(first.trim())||/\[[^\]]+\]\{/.test(src)&&/^\s*пример\s*:/im.test(src)){
    const r=layMolniya(src,W);return{scheme:'МОЛНИЯ',svg:r.svg,h:r.h,warns:r.warns};}
  const {root,opts}=parse(src);if(opts['ширина'])W=parseInt(opts['ширина'])||W;
  opts.__W=W;const scheme=chooseScheme(root,opts);let r;
  const sc=scheme.replace('ё','е');
  if(sc==='гном')r=layGnom(root,W,opts);
  else if(['батарея','лестница','лестница со связкой','лестница с гребенкой'].includes(sc))r=laySpine(root,W,opts,sc);
  else if(sc==='линейка')r=layRuler(root,W,opts,false);
  else if(sc==='шахматы')r=layRuler(root,W,opts,true);
  else if(sc==='гребенка')r=layComb(root,W,opts,false);
  else if(sc==='гребенка со связкой')r=layComb(root,W,opts,true);
  else if(sc==='эполеты')r=layEpaulets(root,W);
  else if(sc.startsWith('очная ставка')||sc==='двуглавый змей')r=layFaceoff(root,W,sc);
  else if(sc==='дерево')r=layTree(root,W);
  else r=laySpine(root,W,opts,'лестница');
  return{scheme,svg:r.svg,h:r.h,warns:lint(root,sc,opts)};
}

/* ============ интерфейс ============ */
const $=id=>document.getElementById(id);
const sel=$('ex');Object.keys(EX).forEach(k=>{const o=document.createElement('option');o.textContent=k;sel.appendChild(o);});
let svgText='';
function update(){
  const W=+$('w').value;let r;
  try{r=render($('src').value,W);}catch(e){$('pic').innerHTML='<pre>'+esc(e.stack)+'</pre>';$('meta').textContent='ОШИБКА';return;}
  const cls=($('sc').checked?'selfcheck ':'')+($('bl').checked?'blind':'');
  svgText=`<svg xmlns="http://www.w3.org/2000/svg" class="${cls}" width="${W}" height="${Math.ceil(r.h)}" viewBox="0 0 ${W} ${Math.ceil(r.h)}" font-family="Arial, Helvetica, sans-serif">${r.svg}</svg>`;
  $('pic').innerHTML=svgText;
  $('meta').textContent='Схема: '+r.scheme;
  $('warn').innerHTML=(r.warns&&r.warns.length?r.warns.map(w=>'<div>'+esc(w)+'</div>').join(''):'<div class="ok">Замечаний нет</div>');
}
sel.onchange=()=>{$('src').value=EX[sel.value];update();};
['src','w','sc','bl'].forEach(id=>$(id).addEventListener('input',update));
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml'}));a.download='konspekt.svg';a.click();};
$('src').value=EX[sel.value=Object.keys(EX)[0]];update();
// для автотеста
window.__render=(name,W)=>{sel.value=name;$('src').value=EX[name];if(W)$('w').value=W;update();return $('meta').textContent+' | '+$('warn').innerText;};
window.__names=Object.keys(EX);
</script>
