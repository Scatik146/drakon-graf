<svg xmlns="http://www.w3.org/2000/svg" width="680" height="295" viewBox="0 0 680 295" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><path d="M10.0,16.5H162.7L176.7,41.5L162.7,66.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="87.3" y="36.5" font-size="15" text-anchor="middle" fill="#111">Свойство</text><text x="87.3" y="54.5" font-size="15" text-anchor="middle" fill="#111">переместительное</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="188.7" y="12.0" width="443.3" height="63.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="186.7" y="10.0" width="443.3" height="63.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="194.7" y="31.0" font-size="15" text-anchor="start" fill="#111">a + b = b + a</text><line x1="196.7" y1="48.0" x2="196.7" y2="64.0" stroke="#333" stroke-width="2"/><text x="204.7" y="60.0" font-size="15" text-anchor="start" fill="#111">От перестановки слагаемых сумма не меняется.</text></g></g><rect x="640.0" y="28.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="46.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,87.0H162.7L176.7,112.0L162.7,137.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="87.3" y="107.0" font-size="15" text-anchor="middle" fill="#111">Свойство</text><text x="87.3" y="125.0" font-size="15" text-anchor="middle" fill="#111">сочетательное</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="188.7" y="89.0" width="443.3" height="50.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="186.7" y="87.0" width="443.3" height="50.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="194.7" y="116.0" font-size="15" text-anchor="start" fill="#111">(a + b) + c = a + (b + c)</text></g></g><rect x="640.0" y="99.0" width="26.0" height="2