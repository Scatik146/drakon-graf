 stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="192.0" font-size="14" text-anchor="start" fill="#111">3. Записать второй закон Ньютона в векторном виде.</text></g></g><line x1="14.0" y1="188.5" x2="30.0" y2="188.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="219.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="217.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="237.0" font-size="14" text-anchor="start" fill="#111">4. Спроецировать на оси.</text></g></g><line x1="14.0" y1="233.5" x2="30.0" y2="233.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="264.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="262.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="282.0" font-size="14" text-anchor="start" fill="#111">5. Решить систему уравнений.</text></g></g><rect x="290.0" y="315.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,315.0L410.0,296.0L406.0,315.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="315.0" x2="404.4" y2="315.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="332.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="317.7" y="354.0" font-size="14" text-anchor="start" fill="#111">Брусок на наклонной:</text><svg x="464.80" y="344.38" width="157.48" height="13.62" viewBox="0 -687 11248.7 973" overflow="visible" color="#111"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><path d="M730 103L704 86C675 67 653 56 643 56C636 56 630 65 630 76C630 86 632 95 637