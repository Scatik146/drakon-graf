<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Эталон ДРАКОН-ГРАФ снят только с этими шрифтами:
     PT Sans и PT Mono (ПараТайп, OFL; лежат в graf/fonts) — основной текст и код;
     Inter и DejaVu Sans — запасные для знаков, которых нет в PT Sans (⇒ ⊥ ∠ ∈ ₙ ⁻). -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/opentype/inter</dir>
  <!-- копия настроек машины, где снят эталон: сглаживание, хинтинг, порядок шрифтов -->
  <include prefix="relative">conf.d</include>
  <alias binding="strong"><family>PT Sans</family><prefer><family>PT Sans</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>PT Sans</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>PT Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <cachedir>/tmp/drakon-graf-fontcache</cachedir>
</fontconfig>
