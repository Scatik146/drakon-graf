<svg xmlns="http://www.w3.org/2000/svg" width="680" height="406" viewBox="0 0 680 406" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="121.8" y1="111.0" x2="121.8" y2="229.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="130.9" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="126.9" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Сравнение</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">рациональных чисел</text><line x1="121.8" y1="39.0" x2="219.1" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="121.8" y1="39.0" x2="121.8" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="223.5" height="29.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="121.8" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы сравнить два числа:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.8" y="125.0" width="532.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.8" y="123.0" width="532.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.8" y="143.0" font-size="14" text-anchor="start" fill="#111">1. Если знаки разные — больше положительное.</text></g></g><line x1="121.8" y1="139.5" x2="137.8" y2="139.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.8" y="170.0" width="532.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.8" y="168.0" width="532.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.8" y="188.0" font-size="14" text-anchor="start" fill="#111">2. Если оба положительные — больше то, у которого больше модуль.</text></g></g><line x1="121.8" y1="184.5" x2="137.8" y2="184.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.8" y="215.0" width="532.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.8" y="213.0" width="532.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.8" y="233.0" font-size="14" text-anchor="start" fill="#111">3. Если оба отрицательные — больше то, у которого меньше модуль.</text></g></g><rect x="290.0" y="266.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,266.0L410.0,247.0L406.0,266.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="266.0" x2="404.4" y2="266.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="283.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="305.0" font-size="14" text-anchor="middle" fill="#111">−3 &gt; −7, так как |−3| &lt; |−7|</text><rect x="290.0" y="338.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,338.0L410.0,319.0L406.0,338.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="338.0" x2="404.4" y2="338.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="355.0" font-size="14" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="470.0" y="377.0" font-size="14" text-anchor="middle" fill="#111">−3 &lt; −7 — сравнили модули, забыв про знак</text><line x1="121.8" y1="229.5" x2="137.8" y2="229.5" stroke="#993300" stroke-width="1.5"/></g></svg>