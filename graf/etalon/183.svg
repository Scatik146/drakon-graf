<svg xmlns="http://www.w3.org/2000/svg" width="680" height="226" viewBox="0 0 680 226" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,11.0H146.0L160.0,26.5L146.0,42.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="30.0" font-size="14" text-anchor="middle" fill="#111">Теорема сложения</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Для несовместных событий P(A ∪ B) = P(A) + P(B).</text></g></g><rect x="640.0" y="13.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="30.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="65.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,65.0L382.0,44.0L376.0,65.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="65.0" x2="374.4" y2="65.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="82.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="104.0" font-size="14" text-anchor="middle" fill="#111">На кубике «1» или «6»: 1/6 + 1/6 = 1/3</text><rect x="260.0" y="139.0" width="360.0" height="69.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,139.0L382.0,118.0L376.0,139.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="139.0" x2="374.4" y2="139.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="156.0" font-size="14" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="440.0" y="178.0" font-size="14" text-anchor="middle" fill="#111">«чётное» или «больше 3»: 3/6 + 3/6</text><text x="440.0" y="195.0" font-size="14" text-anchor="middle" fill="#111">= 1 — неверно, события совместны</text></g></svg>