<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="193.0" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="189.0" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Найдите все натуральные n,</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">при которых n² + 1 делится на 3</text><rect x="100.0" y="78.0" width="480.0" height="126.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="94.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="126.0" y="116.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="132.0" y="116.0" font-size="14" text-anchor="start" fill="#111">n ≡ 0, 1, 2 (mod 3)</text><text x="126.0" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="132.0" y="139.0" font-size="14" text-anchor="start" fill="#111">n² ≡ 0, 1, 1 (mod 3)</text><line x1="296.7" y1="129.0" x2="296.7" y2="143.0" stroke="#993300" stroke-width="1"/><text x="304.7" y="138.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">перебрали все остатки при делении на 3</text><text x="126.0" y="162.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="132.0" y="162.0" font-size="14" text-anchor="start" fill="#111">n² + 1 ≡ 1, 2, 2 (mod 3)</text><text x="126.0" y="185.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇔</text><text x="132.0" y="185.0" font-size="14" text-anchor="start" fill="#111">никогда не делится на 3</text><line x1="296.7" y1="175.0" x2="296.7" y2="189.0" stroke="#993300" stroke-width="1"/><text x="304.7" y="184.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">ни один остаток не равен нулю</text></g></svg>