name: Эталон ДРАКОН-ГРАФ
on:
  push:
  pull_request:
jobs:
  etalon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Запасные шрифты эталона (DejaVu, Inter; PT Sans и PT Mono — в репозитории)
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-inter
      - name: Сверка с эталоном, геометрия, типографика
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/graf/tests/fonts/fonts.conf
        run: |
          npm test
      - name: Рисунки, отличающиеся от эталона
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff
          path: graf/tests/diff/
