<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="202.7" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="198.7" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Какую силу надо приложить,</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">чтобы поднять 50 кг рычагом 1 : 5?</text><rect x="100.0" y="78.0" width="480.0" height="126.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="94.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="125.4" y="116.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="131.4" y="116.0" font-size="14" text-anchor="start" fill="#111">F₁ · l₁ = F₂ · l₂</text><text x="125.4" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="139.0" font-size="14" text-anchor="start" fill="#111">F₁ = F₂ · l₂ / l₁</text><line x1="223.8" y1="129.0" x2="223.8" y2="143.0" stroke="#993300" stroke-width="1"/><text x="231.8" y="138.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">выразили</text><text x="125.4" y="162.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="131.4" y="162.0" font-size="14" text-anchor="start" fill="#111">500 Н · 1/5</text><line x1="223.8" y1="152.0" x2="223.8" y2="166.0" stroke="#993300" stroke-width="1"/><text x="231.8" y="161.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">вес груза mg ≈ 500 Н</text><text x="125.4" y="185.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="131.4" y="185.0" font-size="14" text-anchor="start" fill="#111">100 Н</text></g></svg>