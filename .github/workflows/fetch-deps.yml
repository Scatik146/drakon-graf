name: Проверка выпущенного пакета (служебная ветка)
on:
  push:
    branches: [deps-fetch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сведения из npm
        run: npm view drakon-graf name version dist-tags maintainers dist.tarball dist.integrity
      - name: Установка из npm в чистую папку, как у пользователя
        run: |
          mkdir -p /tmp/user && cd /tmp/user && npm init -y >/dev/null
          npm install drakon-graf@0.9.0
          npm audit --omit=dev || true
      - run: node smoke.mjs /tmp/user
      - name: CDN jsDelivr (файлы, на которые ссылается README)
        run: |
          for u in https://cdn.jsdelivr.net/npm/drakon-graf@0.9/dist/drakon-graf.min.js \
                   https://cdn.jsdelivr.net/npm/drakon-graf@0.9.0/fonts/PT_Serif-Web-Regular.ttf \
                   https://cdn.jsdelivr.net/npm/@mathjax/mathjax-asana-font@4.1.3/tex-mml-svg-mathjax-asana.js; do
            echo "$(curl -sSL -o /dev/null -w '%{http_code} %{size_download}' "$u")  $u"
          done
