<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Эталон ДРАКОН-ГРАФ (v8.3) снят с этими шрифтами:
     PT Serif и PT Mono (ПараТайп, OFL) — текст и код; Asana Math (OFL) — математические знаки и греческие буквы;
     DejaVu Sans — несколько знаков, которых нет в Asana Math (ᵏ ₙ ✗). Всё, кроме DejaVu, лежит в graf/fonts.
     Ширины в библиотеке считаются по таблицам; этот набор нужен для пересборки таблиц и для проверки геометрии. -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <include prefix="relative">conf.d</include>
  <alias binding="strong"><family>PT Serif</family><prefer><family>PT Serif</family><family>Asana Math</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>PT Serif</family><family>Asana Math</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>PT Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <cachedir>/tmp/drakon-graf-fontcache3</cachedir>
</fontconfig>
