<svg xmlns="http://www.w3.org/2000/svg" width="680" height="153" viewBox="0 0 680 153" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,24.0H146.0L160.0,46.0L146.0,68.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="41.0" font-size="12" text-anchor="middle" fill="#111">Теорема центральная</text><text x="79.0" y="56.0" font-size="12" text-anchor="middle" fill="#111">предельная</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="72.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="72.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="28.0" font-size="12" text-anchor="start" fill="#111">Сумма большого числа независимых одинаково распределённых величин</text><text x="178.0" y="43.0" font-size="12" text-anchor="start" fill="#111">распределена почти нормально.</text><line x1="180.0" y1="60.0" x2="180.0" y2="73.0" stroke="#333" stroke-width="2"/><text x="188.0" y="69.0" font-size="12" text-anchor="start" fill="#111">Поэтому рост, ошибки измерений и баллы ЕГЭ похожи на «колокол».</text></g></g><rect x="640.0" y="33.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="48.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="104.0" width="360.0" height="31.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,104.0L382.0,83.0L376.0,104.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="361.6" y1="104.0" x2="374.4" y2="104.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="440.0" y="122.0" font-size="12" text-anchor="middle" fill="#111">Бросьте 30 кубиков и сложите — получите колокол</text></g></svg>