<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="118.4" y1="111.0" x2="118.4" y2="274.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="130.8" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="126.8" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Метод доказательства</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">от противного</text><line x1="118.4" y1="39.0" x2="219.2" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="118.4" y1="39.0" x2="118.4" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="216.8" height="29.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="118.4" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы доказать утверждение:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="136.4" y="125.0" width="535.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="134.4" y="123.0" width="535.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="142.4" y="143.0" font-size="14" text-anchor="start" fill="#111">1. Предположить, что верно обратное.</text></g></g><line x1="118.4" y1="139.5" x2="134.4" y2="139.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="136.4" y="170.0" width="535.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="134.4" y="168.0" width="535.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="142.4" y="188.0" font-size="14" text-anchor="start" fill="#111">2. Рассуждать, опираясь на это предположение.</text></g></g><line x1="118.4" y1="184.5" x2="134.4" y2="184.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="136.4" y="215.0" width="535.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="134.4" y="213.0" width="535.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="142.4" y="233.0" font-size="14" text-anchor="start" fill="#111">3. Прийти к противоречию с условием или известным фактом.</text></g></g><line x1="118.4" y1="229.5" x2="134.4" y2="229.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="136.4" y="260.0" width="535.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="134.4" y="258.0" width="535.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="142.4" y="278.0" font-size="14" text-anchor="start" fill="#111">4. Сделать вывод: предположение неверно, утверждение верно.</text></g></g><rect x="290.0" y="311.0" width="360.0" height="86.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,311.0L410.0,292.0L406.0,311.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="311.0" x2="404.4" y2="311.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="328.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="350.0" font-size="14" text-anchor="middle" fill="#111">Две прямые, параллельные третьей,</text><text x="470.0" y="367.0" font-size="14" text-anchor="middle" fill="#111">параллельны: иначе через точку прошли</text><text x="470.0" y="384.0" font-size="14" text-anchor="middle" fill="#111">бы две параллельные одной прямой</text><line x1="118.4" y1="274.5" x2="134.4" y2="274.5" stroke="#993300" stroke-width="1.5"/></g></svg>