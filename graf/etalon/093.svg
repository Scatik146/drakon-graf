e="14" text-anchor="middle" font-weight="bold" fill="#111">i</text><rect x="241.9" y="0.0" width="250.0" height="29.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M358.9,29.0L366.9,68.0L374.9,29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="360.5" y1="29.0" x2="373.3" y2="29.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="366.9" y="18.0" font-size="14" text-anchor="middle" fill="#111">По определению i² = −1.</text><rect x="180.0" y="118.0" width="151.2" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M309.6,118.0L315.6,91.0L321.6,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="310.8" y1="118.0" x2="320.4" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="255.6" y="134.0" font-size="14" text-anchor="middle" fill="#111">действительная часть</text><rect x="365.7" y="118.0" width="122.4" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M369.7,118.0L366.9,91.0L381.7,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="370.9" y1="118.0" x2="380.5" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="426.9" y="134.0" font-size="14" text-anchor="middle" fill="#111">мнимая единица</text><rect x="298.0" y="151.0" width="102.6" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M343.3,151.0L349.3,91.0L355.3,151.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="344.5" y1="151.0" x2="354.1" y2="151.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="349.3" y="167.0" font-size="14" text-anchor="middle" fill="#111">мнимая часть</text></g></g><line x1="10.0" y1="276.0" x2="670.0" y2="276.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,284.0)"><path d="M10.0,11.0H146.0L160.0,26.5L146.0,42.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="30.0" font-size="14" text-anchor="middle" fill="#111">Что такое модуль</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Это расстояние до начала координат: |z| = √(a² + b²).</text></g></g><rect x="640.0" y="13.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="30.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text></g></svg>