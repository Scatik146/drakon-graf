<svg xmlns="http://www.w3.org/2000/svg" width="680" height="287" viewBox="0 0 680 287" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,16.5H155.2L169.2,40.5L155.2,64.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="83.6" y="35.5" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="83.6" y="52.5" font-size="14" text-anchor="middle" fill="#111">переместительное</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="181.2" y="12.0" width="450.8" height="61.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="179.2" y="10.0" width="450.8" height="61.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="187.2" y="30.0" font-size="14" text-anchor="start" fill="#111">a + b = b + a</text><line x1="189.2" y1="47.0" x2="189.2" y2="62.0" stroke="#333" stroke-width="2"/><text x="197.2" y="58.0" font-size="14" text-anchor="start" fill="#111">От перестановки слагаемых сумма не меняется.</text></g></g><rect x="640.0" y="27.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="44.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,85.0H155.2L169.2,109.0L155.2,133.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="83.6" y="104.0" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="83.6" y="121.0" font-size="14" text-anchor="middle" fill="#111">сочетательное</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="181.2" y="87.0" width="450.8" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="179.2" y="85.0" width="450.8" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="187.2" y="112.5" font-size="14" text-anchor="start" fill="#111">(a + b) + c = a + (b + c)</text></g></g><rect x="640.0" y="96.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="113.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2</text><path d="M10.0,147.0H155.2L169.2,171.0L155.2,195.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="83.6" y="166.0" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="83.6" y="183.0" font-size="14" text-anchor="middle" fill="#111">распределительное</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="181.2" y="149.0" width="450.8" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="179.2" y="147.0" width="450.8" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="187.2" y="174.5" font-size="14" text-anchor="start" fill="#111">a · (b + c) = a · b + a · c</text></g></g><rect x="640.0" y="158.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="175.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3</text><rect x="260.0" y="217.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,217.0L382.0,196.0L376.0,217.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="217.0" x2="374.4" y2="217.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="234.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="256.0" font-size="14" text-anchor="middle" fill="#111">7 · 13 + 7 · 7 = 7 · (13 + 7) = 140</text></g></svg>