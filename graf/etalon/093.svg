5L146.0,42.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="30.0" font-size="14" text-anchor="middle" fill="#111">Что такое модуль</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Это расстояние до начала координат: |z| = √(a² + b²).</text></g></g><rect x="640.0" y="13.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="30.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text></g></svg>