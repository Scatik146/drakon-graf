300" stroke-width="1.1"/><g data-k="tail"><path d="M362.9,59.0L368.9,32.0L374.9,59.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="364.1" y1="59.0" x2="373.7" y2="59.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="395.9" y="74.0" font-size="13" text-anchor="middle" fill="#111">показатель</text><rect x="289.0" y="107.0" width="89.9" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M327.9,107.0L333.9,32.0L339.9,107.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="329.1" y1="107.0" x2="338.7" y2="107.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="333.9" y="122.0" font-size="13" text-anchor="middle" fill="#111">число: b &gt; 0</text></g><rect x="10.0" y="173.0" width="660.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="190.0" font-size="13" text-anchor="middle" fill="#111">Значит:</text><path d="M331,201V214H320L340,227L360,214H349V201" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="233.0" width="660.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="231.0" width="660.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="250.0" font-size="13" text-anchor="middle" fill="#111">aᶜ = b</text></g></g></g></svg>