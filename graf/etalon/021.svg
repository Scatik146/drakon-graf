<svg xmlns="http://www.w3.org/2000/svg" width="680" height="379" viewBox="0 0 680 379" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="108.4" y1="94.0" x2="108.4" y2="257.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.5" rx="110.0" ry="20.5" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.5" rx="106.0" ry="17.5" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Алгоритм Евклида</text><line x1="108.4" y1="30.5" x2="240.0" y2="30.5" stroke="#993300" stroke-width="1.5"/><line x1="108.4" y1="30.5" x2="108.4" y2="65.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="65.0" width="196.8" height="29.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="108.4" y="83.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы найти НОД(a, b):</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="126.4" y="108.0" width="545.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="124.4" y="106.0" width="545.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="132.4" y="126.0" font-size="14" text-anchor="start" fill="#111">1. Разделить большее число на меньшее с остатком.</text></g></g><line x1="108.4" y1="122.5" x2="124.4" y2="122.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="126.4" y="153.0" width="545.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="124.4" y="151.0" width="545.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="132.4" y="171.0" font-size="14" text-anchor="start" fill="#111">2. Заменить большее число остатком.</text></g></g><line x1="108.4" y1="167.5" x2="124.4" y2="167.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="126.4" y="198.0" width="545.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="124.4" y="196.0" width="545.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="132.4" y="216.0" font-size="14" text-anchor="start" fill="#111">3. Повторять, пока остаток не станет равен нулю.</text></g></g><line x1="108.4" y1="212.5" x2="124.4" y2="212.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="126.4" y="243.0" width="545.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="124.4" y="241.0" width="545.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="132.4" y="261.0" font-size="14" text-anchor="start" fill="#111">4. Последний ненулевой остаток — это НОД.</text></g></g><rect x="290.0" y="294.0" width="360.0" height="69.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,294.0L410.0,275.0L406.0,294.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="294.0" x2="404.4" y2="294.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="311.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="333.0" font-size="14" text-anchor="middle" fill="#111">НОД(48, 18): 48 = 18 · 2 + 12. 18 =</text><text x="470.0" y="350.0" font-size="14" text-anchor="middle" fill="#111">12 · 1 + 6. 12 = 6 · 2 + 0. Ответ: 6</text><line x1="108.4" y1="257.5" x2="124.4" y2="257.5" stroke="#993300" stroke-width="1.5"/></g></svg>