<svg xmlns="http://www.w3.org/2000/svg" width="680" height="393" viewBox="0 0 680 393" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="39.0" x2="14.0" y2="360.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="297.1" cy="39.0" rx="118.9" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="297.1" cy="39.0" rx="114.9" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="297.1" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Как решать задачу</text><text x="297.1" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">на части</text><rect x="434.0" y="15.0" width="230.0" height="50.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M434.0,30.0L415.0,39.0L434.0,44.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="434.0" y1="31.4" x2="434.0" y2="42.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="549.0" y="35.0" font-size="14" text-anchor="middle" fill="#111">Для варенья берут 2 части ягод</text><text x="549.0" y="52.0" font-size="14" text-anchor="middle" fill="#111">и 3 части сахара. Всего 10 кг.</text><line x1="14.0" y1="39.0" x2="178.3" y2="39.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="84.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="82.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="102.0" font-size="14" text-anchor="start" fill="#111">1. Принять одну часть за x.</text></g></g><line x1="14.0" y1="98.5" x2="30.0" y2="98.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="129.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="127.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="147.0" font-size="14" text-anchor="start" fill="#111">2. Выразить все величины через x: ягоды 2x, сахар 3x.</text></g></g><line x1="14.0" y1="143.5" x2="30.0" y2="143.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="174.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="172.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="192.0" font-size="14" text-anchor="start" fill="#111">3. Составить уравнение по общему количеству.</text></g></g><rect x="290.0" y="225.0" width="360.0" height="107.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,225.0L410.0,206.0L406.0,225.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="225.0" x2="404.4" y2="225.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="242.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="314.6" y="265.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="320.6" y="265.0" font-size="15" text-anchor="start" fill="#111">2x + 3x = 10</text><text x="314.6" y="289.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="320.6" y="289.0" font-size="15" text-anchor="start" fill="#111">5x = 10</text><line x1="406.7" y1="278.0" x2="406.7" y2="293.0" stroke="#993300" stroke-width="1"/><text x="414.7" y="288.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">привели подобные</text><text x="314.6" y="313.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="320.6" y="313.0" font-size="15" text-anchor="start" fill="#111">x = 2</text><line x1="406.7" y1="302.0" x2="406.7" y2="317.0" stroke="#993300" stroke-width="1"/><text x="414.7" y="312.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">одна часть — 2 кг</text><line x1="14.0" y1="188.5" x2="30.0" y2="188.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="346.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="344.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="364.0" font-size="14" text-anchor="start" fill="#111">4. Ответить на вопрос задачи: ягод 4 кг, сахара 6 кг.</text></g></g><line x1="14.0" y1="360.5" x2="30.0" y2="360.5" stroke="#993300" stroke-width="1.5"/></g></svg>