<svg xmlns="http://www.w3.org/2000/svg" width="680" height="163" viewBox="0 0 680 163" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,41.0L146.0,72.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="28.0" font-size="13" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="44.0" font-size="13" text-anchor="middle" fill="#111">математическое</text><text x="79.0" y="60.0" font-size="13" text-anchor="middle" fill="#111">ожидание</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="62.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="62.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="44.0" font-size="13" text-anchor="start" fill="#111">Это среднее значение с учётом вероятностей: E X = Σ xi pi.</text></g></g><rect x="640.0" y="28.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="44.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,92.5H146.0L160.0,115.5L146.0,138.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="110.5" font-size="13" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="126.5" font-size="13" text-anchor="middle" fill="#111">дисперсия</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="88.0" width="460.0" height="59.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="86.0" width="460.0" height="59.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="105.0" font-size="13" text-anchor="start" fill="#111">Это среднее квадрата отклонения от ожидания: D X = E(X − E X)².</text><line x1="180.0" y1="122.0" x2="180.0" y2="136.0" stroke="#333" stroke-width="2"/><text x="188.0" y="132.0" font-size="13" text-anchor="start" fill="#111">Стандартное отклонение σ = √(D X) — в тех же единицах, что и X.</text></g></g><rect x="640.0" y="102.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="118.5" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">2</text></g></svg>