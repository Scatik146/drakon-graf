<svg xmlns="http://www.w3.org/2000/svg" width="680" height="324" viewBox="0 0 680 324" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="30.5" x2="14.0" y2="291.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.5" rx="110.0" ry="20.5" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.5" rx="106.0" ry="17.5" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Метод интервалов</text><line x1="14.0" y1="30.5" x2="240.0" y2="30.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="67.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="65.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="85.0" font-size="14" text-anchor="start" fill="#111">1. Перенести всё в левую часть: f(x) &gt; 0.</text></g></g><line x1="14.0" y1="81.5" x2="30.0" y2="81.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="112.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="110.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="130.0" font-size="14" text-anchor="start" fill="#111">2. Найти нули и точки, где f(x) не определена.</text></g></g><line x1="14.0" y1="126.5" x2="30.0" y2="126.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="157.0" width="640.0" height="108.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="155.0" width="640.0" height="108.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="175.0" font-size="14