<svg xmlns="http://www.w3.org/2000/svg" width="680" height="234" viewBox="0 0 680 234" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><path d="M10.0,33.0H146.0L160.0,48.5L146.0,64.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="52.0" font-size="14" text-anchor="middle" fill="#111">Теорема Виета</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="77.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="77.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Для x² + px + q = 0 сумма корней равна −p, произведение равно q.</text><rect x="178.0" y="46.0" width="444.0" height="33.0" rx="0" fill="#fff" stroke="#993300" stroke-width="2"/><text x="400.0" y="66.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">x₁ + x₂ = −p, x₁ x₂ = q</text></g></g><rect x="640.0" y="35.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="52.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="109.0" width="360.0" height="107.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,109.0L382.0,88.0L376.0,109.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="109.0" x2="374.4" y2="109.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="126.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="284.6" y="149.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="290.6" y="149.0" font-size="15" text-anchor="start" fill="#111">x² − 5x + 6 = 0</text><text x="284.6" y="173.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="290.6" y="173.0" font-size="15" text-anchor="start" fill="#111">x₁ + x₂ = 5, x₁ x₂ = 6</text><line x1="428.9" y1="162.0" x2="428.9" y2="177.0" stroke="#993300" stroke-width="1"/><text x="436.9" y="172.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">по теореме Виета</text><text x="284.6" y="197.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="290.6" y="197.0" font-size="15" text-anchor="start" fill="#111">x₁ = 2, x₂ = 3</text><line x1="428.9" y1="186.0" x2="428.9" y2="201.0" stroke="#993300" stroke-width="1"/><text x="436.9" y="196.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">подобрали</text></g></svg>