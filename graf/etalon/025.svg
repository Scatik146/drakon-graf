<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="112.4" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="108.4" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Из чего состоит</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">теорема?</text><g transform="translate(10.0,80.0)"><rect x="90.0" y="93.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><text x="172.6" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Если</text><text x="205.2" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="210.0" y="102.0" width="152.6" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="286.2" y="118.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">углы вертикальные</text><text x="363.5" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">,</text><text x="367.8" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="371.6" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">то</text><text x="387.4" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="392.2" y="102.0" width="90.0" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="437.2" y="118.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">они равны</text><text x="483.2" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">.</text><rect x="236.7" y="0.0" width="250.0" height="63.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="t