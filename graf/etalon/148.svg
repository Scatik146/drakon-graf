<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,32.5H146.0L160.0,65.0L146.0,97.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="51.5" font-size="14" text-anchor="middle" fill="#111">Арифметический</text><text x="79.0" y="68.5" font-size="14" text-anchor="middle" fill="#111">квадратный</text><text x="79.0" y="85.5" font-size="14" text-anchor="middle" fill="#111">корень из a</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="110.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="110.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="30.0" font-size="14" text-anchor="start" fill="#111">Это неотрицательное число, квадрат которого равен a.</text><circle cx="182.0" cy="53.0" r="4.2" fill="#CC6600"/><text x="192.0" y="58.0" font-size="14" text-anchor="start" fill="#111">√a ≥ 0</text><circle cx="182.0" cy="74.0" r="4.2" fill="#CC6600"/><text x="192.0" y="79.0" font-size="14" text-anchor="start" fill="#111">(√a)² = a при a ≥ 0</text><line x1="180.0" y1="96.0" x2="180.0" y2="111.0" stroke="#333" stroke-width="2"/><text x="188.0" y="107.0" font-size="14" text-anchor="start" fill="#111">Корень из отрицательного числа не определён.</text></g></g><rect x="640.0" y="52.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="69.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,134.0H146.0L160.0,158.0L146.0,182.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="153.0" font-size="14" text-anchor="middle" fill="#111">Свойство корня</text><text x="79.0" y="170.0" font-size="14" text-anchor="middle" fill="#111">из квадрата</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="136.0" width="460.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="134.0" width="460.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="161.5" font-size="14" text-anchor="start" fill="#111">√(a²) = |a|</text></g></g><rect x="640.0" y="145.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="162.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2</text><rect x="260.0" y="204.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,204.0L382.0,183.0L376.0,204.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="204.0" x2="374.4" y2="204.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="221.0" font-size="14" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="440.0" y="243.0" font-size="14" text-anchor="middle" fill="#111">√((−3)²) = −3 — неверно, верно 3</text></g></svg>