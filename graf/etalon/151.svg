<svg xmlns="http://www.w3.org/2000/svg" width="680" height="283" viewBox="0 0 680 283" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="150.3" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="146.3" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Докажите, что √2 —</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">иррациональное число</text><rect x="100.0" y="78.0" width="480.0" height="149.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="94.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="125.4" y="116.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="131.4" y="116.0" font-size="14" text-anchor="start" fill="#111">Пусть √2 = p/q, дробь несократима</text><text x="125.4" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="139.0" font-size="14" text-anchor="start" fill="#111">p² = 2q²</text><line x1="366.0" y1="129.0" x2="366.0" y2="143.0" stroke="#993300" stroke-width="1"/><text x="374.0" y="138.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">возвели в квадрат</text><text x="125.4" y="162.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="162.0" font-size="14" text-anchor="start" fill="#111">p = 2k</text><line x1="366.0" y1="152.0" x2="366.0" y2="166.0" stroke="#993300" stroke-width="1"/><text x="374.0" y="161.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">p² чётно, значит, p чётно</text><text x="125.4" y="185.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="185.0" font-size="14" text-anchor="start" fill="#111">q² = 2k²</text><line x1="366.0" y1="175.0" x2="366.0" y2="189.0" stroke="#993300" stroke-width="1"/><text x="374.0" y="184.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">подставили</text><text x="125.4" y="208.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="208.0" font-size="14" text-anchor="start" fill="#111">q чётно</text><line x1="366.0" y1="198.0" x2="366.0" y2="212.0" stroke="#993300" stroke-width="1"/><text x="374.0" y="207.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">так же</text><rect x="100.0" y="239.0" width="480.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="256.0" font-size="13" text-anchor="middle" fill="#111">Противоречие: p и q оба чётные, а дробь несократима.</text></g></svg>