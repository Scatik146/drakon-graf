<svg xmlns="http://www.w3.org/2000/svg" width="680" height="259" viewBox="0 0 680 259" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,34.0L146.0,58.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="29.0" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="79.0" y="46.0" font-size="14" text-anchor="middle" fill="#111">линейности</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="37.5" font-size="14" text-anchor="start" fill="#111">E(aX + b) = a·E(X) + b</text></g></g><rect x="640.0" y="21.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="38.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,73.0H146.0L160.0,88.5L146.0,104.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="92.0" font-size="14" text-anchor="middle" fill="#111">Свойство суммы</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="74.0" width="460.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="72.0" width="460.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="92.0" font-size="14" text-anchor="start" fill="#111">E(X + Y) = E(X) + E(Y) — всегда, даже для зависимых.</text></g></g><rect x="640.0" y="75.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="92.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2</text><path d="M10.0,119.0H146.0L160.0,143.0L146.0,167.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="138.0" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="79.0" y="155.0" font-size="14" text-anchor="middle" fill="#111">произведения</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="121.0" width="460.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="119.0" width="460.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="146.5" font-size="14" text-anchor="start" fill="#111">E(XY) = E(X)·E(Y) — только для независимых.</text></g></g><rect x="640.0" y="130.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="147.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">3</text><rect x="260.0" y="189.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,189.0L382.0,168.0L376.0,189.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="189.0" x2="374.4" y2="189.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="206.0" font-size="14" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="440.0" y="228.0" font-size="14" text-anchor="middle" fill="#111">X = Y = орёл (1/0): E(XY) = 1/2, а E(X)·E(Y) = 1/4</text></g></svg>