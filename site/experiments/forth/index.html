<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДРАКОН-ГРАФ на Forth — эксперимент 1</title>
<style>
  body { font: 15px/1.45 "PT Serif", Georgia, serif; margin: 24px auto; max-width: 980px; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 16px; }
  button { font: inherit; padding: 8px 16px; margin: 8px 8px 8px 0; cursor: pointer; }
  #status { font-size: 14px; color: #993300; }
  #summary { font-size: 16px; font-weight: bold; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  td, th { border: 1px solid #d8c8a8; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #ffff99; }
  tr.ok { background: #eef8ee; } tr.bad { background: #fde8e8; }
  code, pre { font: 13px "PT Mono", monospace; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<h1>ДРАКОН-ГРАФ на Forth — эксперимент 1</h1>
<p class="sub">Настоящий Forth (WAForth, WebAssembly, MIT) лежит рядом, в <code>lib/</code>. Без интернета и без CDN. Нажмите кнопку — 20 тестов на материале ДРАКОН-ГРАФ.</p>
<p id="status">Загружаю Forth…</p>
<button id="run" disabled>Запустить 20 тестов</button>
<div id="summary"></div>
<div id="out"></div>
<noscript>Нужен JavaScript.</noscript>

<script src="tests.js"></script>
<script>
// Все пути относительные. lib/index.js — файл пакета waforth без правок (CommonJS), читаем и запускаем сами.
var WAForth = null, loadMs = null;

// загрузить Forth: прочитать lib/index.js, собрать модуль, поднять ядро; вернуть миллисекунды
async function loadForth() {
  var t0 = performance.now();
  var code = await (await fetch('lib/index.js')).text();
  var mod = { exports: {} };
  new Function('module', 'exports', code)(mod, mod.exports);
  WAForth = mod.exports.default;
  var probe = new WAForth();   // пробный экземпляр: ядро действительно поднялось
  await probe.load();
  return performance.now() - t0;
}

// экранировать: делает текст безопасным для HTML
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

// показать: строка состояния
function say(t) { document.getElementById('status').textContent = t; }

// запустить все тесты и нарисовать таблицу
async function runTests() {
  var btn = document.getElementById('run');
  btn.disabled = true;
  var t0 = performance.now();
  var res = await FORTH_TESTS.runAll(WAForth, FORTH_TESTS.TESTS);
  var total = performance.now() - t0;
  var passed = res.filter(function (r) { return r.pass; }).length;
  var rows = res.map(function (r) {
    return '<tr class="' + (r.pass ? 'ok' : 'bad') + '"><td>' + r.n + '</td><td>' + esc(r.group) + '</td><td>' + esc(r.name) +
      '</td><td>' + (r.pass ? 'прошёл' : 'нет') + '</td><td>' + r.ms.toFixed(1) + '</td><td><code>' + esc(r.out) + '</code>' +
      (r.pass ? '' : '<br>ожидали: <code>' + esc(r.expect) + '</code>') + '</td></tr>';
  }).join('');
  document.getElementById('summary').textContent =
    'Прошло ' + passed + ' из ' + res.length + ' · загрузка Forth ' + loadMs.toFixed(0) + ' мс · 20 тестов ' + total.toFixed(0) + ' мс';
  document.getElementById('out').innerHTML =
    '<table><tr><th>№</th><th>Группа</th><th>Тест</th><th>Итог</th><th>мс</th><th>Вывод Forth</th></tr>' + rows + '</table>';
  btn.disabled = false;
}

loadForth().then(function (ms) {
  loadMs = ms;
  say('Forth загружен за ' + ms.toFixed(0) + ' мс. Нажмите «Запустить 20 тестов».');
  document.getElementById('run').disabled = false;
  document.getElementById('run').onclick = runTests;
}).catch(function (e) { say('Не удалось загрузить Forth: ' + e.message + ' (страница работает только через веб-сервер, не из файла)'); });
</script>
</body>
</html>
