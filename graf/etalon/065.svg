<svg xmlns="http://www.w3.org/2000/svg" width="680" height="317" viewBox="0 0 680 317" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="39.0" x2="14.0" y2="262.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="119.3" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="115.3" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Действия познающего</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">человека</text><line x1="14.0" y1="39.0" x2="230.7" y2="39.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,91.5H166.0L180.0,115.5L166.0,139.5H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="110.5" font-size="14" text-anchor="middle" fill="#111">Обнаружение</text><text x="99.0" y="127.5" font-size="14" text-anchor="middle" fill="#111">сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="84.0" width="310.0" height="67.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="82.0" width="310.0" height="67.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="110.5" font-size="14" text-anchor="start" fill="#111">Это выделение действующего раздражителя</text><text x="198.0" y="127.5" font-size="14" text-anchor="start" fill="#111">из хаоса окружающего фона.</text></g></g><rect x="514.0" y="82.0" width="156.0" height="67.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,97.0L501.0,104.0L514.0,111.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="98.4" x2="514.0" y2="109.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="102.0" font-size="14" text-anchor="middle" fill="#111">— Тут что-то</text><text x="592.0" y="119.0" font-size="14" text-anchor="middle" fill="#111">есть! Но пока</text><text x="592.0" y="136.0" font-size="14" text-anchor="middle" fill="#111">не разберу что.</text><line x1="14.0" y1="115.5" x2="30.0" y2="115.5" stroke="#993300" stroke-width="1.5"/><path d="M30.0,170.5H166.0L180.0,186.0L166.0,201.5H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="189.5" font-size="14" text-anchor="middle" fill="#111">Различение сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="163.0" width="310.0" height="50.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="161.0" width="310.0" height="50.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="181.0" font-size="14" text-anchor="start" fill="#111">Это мысленное отделение одного сигнала</text><text x="198.0" y="198.0" font-size="14" text-anchor="start" fill="#111">от сходного с ним другого.</text></g></g><rect x="514.0" y="161.0" width="156.0" height="50.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,176.0L501.0,183.0L514.0,190.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="177.4" x2="514.0" y2="188.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="181.0" font-size="14" text-anchor="middle" fill="#111">— Это что-то более</text><text x="592.0" y="198.0" font-size="14" text-anchor="middle" fill="#111">тёмное и рыхлое.</text><line x1="14.0" y1="186.0" x2="30.0" y2="186.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,246.5H166.0L180.0,262.0L166.0,277.5H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="265.5" font-size="14" text-anchor="middle" fill="#111">Опознание сигнала</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="225.0" width="310.0" height="78.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="223.0" width="310.0" height="78.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="243.0" font-size="14" text-anchor="start" fill="#111">Это мысленное отнесение объекта</text><text x="198.0" y="260.0" font-size="14" text-anchor="start" fill="#111">к какой-либо группе объектов.</text><line x1="200.0" y1="277.0" x2="200.0" y2="292.0" stroke="#333" stroke-width="2"/><text x="208.0" y="288.0" font-size="14" text-anchor="start" fill="#111">Это мысленное раскладывание по полочкам.</text></g></g><rect x="514.0" y="237.0" width="156.0" height="50.0" rx="10" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M514.0,252.0L501.0,259.0L514.0,266.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="514.0" y1="253.4" x2="514.0" y2="264.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="592.0" y="257.0" font-size="14" text-anchor="middle" fill="#111">— Это какой-то порок</text><text x="592.0" y="274.0" font-size="14" text-anchor="middle" fill="#111">древесины!</text><line x1="14.0" y1="262.0" x2="30.0" y2="262.0" stroke="#993300" stroke-width="1.5"/></g></svg>