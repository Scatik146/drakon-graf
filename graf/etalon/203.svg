<svg xmlns="http://www.w3.org/2000/svg" width="680" height="369" viewBox="0 0 680 369" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="137.7" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="133.7" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Вложенный цикл: таблица</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">умножения</text><g transform="translate(10.0,78.0)"><rect x="90.0" y="74.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="128.2" y="83.0" width="198.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="227.6" y="99.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">for i in range(1, 10):</text><text x="328.1" y="99.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="332.9" y="83.0" width="198.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="432.4" y="99.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='Consolas, "Courier New", monospace' xml:space="preserve" fill="#111">for j in range(1, 10):</text><rect x="307.4" y="0.0" width="250.0" height="44.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M424.4,44.0L432.4,83.0L440.4,44.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="426.0" y1="44.0" x2="438.8" y2="44.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="432.4" y="17.0" font-size="13" text-anchor="middle" fill="#111">Внутренний цикл проходит полностью</text><text x="432.4" y="33.0" font-size="13" text-anchor="middle" fill="#111">на каждом шаге внешнего.</text><rect x="190.9" y="1