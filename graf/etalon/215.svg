<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><line x1="116.4" y1="111.0" x2="116.4" y2="246.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="120.6" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="116.6" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Как найти общее</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">сопротивление</text><line x1="116.4" y1="39.0" x2="229.4" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="116.4" y1="39.0" x2="116.4" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="212.8" height="29.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="116.4" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Для смешанного соединения:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="134.4" y="125.0" width="537.6" height="50.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="132.4" y="123.0" width="537.6" height="50.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="140.4" y="143.0" font-size="14" text-anchor="start" fill="#111">1. Найти участки, где резисторы соединены</text><text x="140.4" y="160.0" font-size="14" text-anchor="start" fill="#111">только последовательно или только параллельно.</text></g></g><line x1="116.4" y1="148.0" x2="132.4" y2="148.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="134.4" y="187.0" width="537.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="132.4" y="185.0" width="537.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="140.4" y="205.0" font-size="14" text-anchor="start" fill="#111">2. Заменить каждый такой участок одним резистором.</text></g></g><line x1="116.4" y1="201.5" x2="132.4" y2="201.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="134.4" y="232.0" width="537.6" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="132.4" y="230.0" width="537.6" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="140.4" y="250.0" font-size="14" text-anchor="start" fill="#111">3. Повторять, пока не останется один резистор.</text></g></g><rect x="290.0" y="283.0" width="360.0" height="69.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,283.0L410.0,264.0L406.0,283.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="283.0" x2="404.4" y2="283.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="300.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="322.0" font-size="14" text-anchor="middle" fill="#111">2 Ом и 2 Ом параллельно = 1 Ом; плюс 3 Ом</text><text x="470.0" y="339.0" font-size="14" text-anchor="middle" fill="#111">последовательно = 4 Ом</text><line x1="116.4" y1="246.5" x2="132.4" y2="246.5" stroke="#993300" stroke-width="1.5"/></g></svg>