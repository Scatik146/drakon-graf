<svg xmlns="http://www.w3.org/2000/svg" width="680" height="357" viewBox="0 0 680 357" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="110.0" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="106.0" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Рекурсивная</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">функция</text><g transform="translate(10.0,80.0)"><rect x="90.0" y="59.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="157.9" y="68.0" width="173.6" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="244.7" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">if n == 0: return 1</text><text x="332.5" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="336.3" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">·</text><text x="340.5" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="345.3" y="68.0" width="156.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="423.7" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">return n * f(n−1)</text><rect x="119.7" y="0.0" width="250.0" height="29.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M236.7,29.0L244.7,68.0L252.7,29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="238.3" y1="29.0" x2="251.1" y2="29.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="244.7" y="18.0" font-size="14" text-anchor="middle" fill="#111">Без базы рекурсия не остановится!</text><rect x="220.6" y="118.0" width="48.4" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M238.7,118.0L244.7,91.0L250.7,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="239.9" y1="118.0" x2="249.5" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="244.7" y="134.0" font-size="14" text-anchor="middle" fill="#111">база</text><rect x="401.3" y="118.0" width="44.8" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M417.7,118.0L423.7,91.0L429.7,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="418.9" y1="118.0" x2="428.5" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="423.7" y="134.0" font-size="14" text-anchor="middle" fill="#111">шаг</text></g></g><line x1="10.0" y1="243.0" x2="670.0" y2="243.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,251.0)"><rect x="18.0" y="18.0" width="181.6" height="70.0" rx="3" fill="#F6F3EA" stroke="#C9BFA6" stroke-width="1"/><text x="26.0" y="33.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">def f(n):</text><text x="26.0" y="48.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    if n == 0:</text><text x="26.0" y="63.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">        return 1</text><text x="26.0" y="78.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    return n * f(n - 1)</text></g></svg>