g data-k="tail"><path d="M280.4,60.0L288.4,99.0L296.4,60.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="282.0" y1="60.0" x2="294.8" y2="60.0" stroke="#FFFF99" stroke-width="2.8"/></g><g data-k="tail"><path d="M430.0,60.0L438.0,99.0L446.0,60.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="431.6" y1="60.0" x2="444.4" y2="60.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="363.2" y="17.0" font-size="13" text-anchor="middle" fill="#111">После «если» — условие</text><text x="363.2" y="33.0" font-size="13" text-anchor="middle" fill="#111">(что дано), после «то» —</text><text x="363.2" y="49.0" font-size="13" text-anchor="middle" fill="#111">заключение (что доказать).</text><rect x="253.8" y="149.0" width="69.2" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M282.4,149.0L288.4,122.0L294.4,149.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="283.6" y1="149.0" x2="293.2" y2="149.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="288.4" y="164.0" font-size="13" text-anchor="middle" fill="#111">условие</text><rect x="392.2" y="149.0" width="91.7" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M432.0,149.0L438.0,122.0L444.0,149.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="433.2" y1="149.0" x2="442.8" y2="149.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="438.0" y="164.0" font-size="13" text-anchor="middle" fill="#111">заключение</text></g></g><line x1="10.0" y1="271.0" x2="670.0" y2="271.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,279.0)"><ellipse cx="340.0" cy="30.0" rx="285.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.0" rx="281.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Теорема и обратная