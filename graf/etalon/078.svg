<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="284.0" y1="62.0" x2="544.0" y2="62.0" stroke="#993300" stroke-width="1.5"/><line x1="414.0" y1="50.0" x2="414.0" y2="62.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="414.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="414.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="414.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Прогрессии</text><rect x="158.0" y="74.0" width="252.0" height="28.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="284.0" y="91.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Арифметическая</text><line x1="284.0" y1="62.0" x2="284.0" y2="74.0" stroke="#993300" stroke-width="1.5"/><rect x="418.0" y="74.0" width="252.0" height="28.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="544.0" y="91.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Геометрическая</text><line x1="544.0" y1="62.0" x2="544.0" y2="74.0" stroke="#993300" stroke-width="1.5"/><path d="M10.0,112.0H132.0L146.0,135.0L132.0,158.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="72.0" y="130.0" font-size="13" text-anchor="middle" fill="#111">Как получаем</text><text x="72.0" y="146.0" font-size="13" text-anchor="middle" fill="#111">следующий</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="160.0" y="114.0" width="252.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="158.0" y="112.0" width="252.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="284.0" y="138.0" font-size="13" text-anchor="middle" fill="#111">прибавляем d</text></g></g><g class="memo" onclick="this.classList.toggle('open')"><rect x="420.0" y="114.0" width="252.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="418.0" y="112.0" width="252.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="544.0" y="138.0" font-size="13" text-anchor="middle" fill="#111">умножаем на q</text></g></g><path d="M10.0,167.0H132.0L146.0,182.0L132.0,197.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="72.0" y="185.0" font-size="13" text-anchor="middle" fill="#111">n-й член</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="160.0" y="168.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="158.0" y="166.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="284.0" y="185.0" font-size="13" text-anchor="middle" fill="#111">aₙ = a₁ + (n − 1)d</text></g></g><g class="memo" onclick="this.classList.toggle('open')"><rect x="420.0" y="168.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="418.0" y="166.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="544.0" y="185.0" font-size="13" text-anchor="middle" fill="#111">bₙ = b₁ · qⁿ⁻¹</text></g></g><path d="M10.0,207.0H132.0L146.0,222.0L132.0,237.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="72.0" y="225.0" font-size="13" text-anchor="middle" fill="#111">Сумма n членов</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="160.0" y="208.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="158.0" y="206.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="284.0" y="225.0" font-size="13" text-anchor="middle" fill="#111">Sₙ = (a₁ + aₙ)n / 2</text></g></g><g class="memo" onclick="this.classList.toggle('open')"><rect x="420.0" y="208.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="418.0" y="206.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="544.0" y="225.0" font-size="13" text-anchor="middle" fill="#111">Sₙ = b₁(qⁿ − 1)/(q − 1)</text></g></g><path d="M10.0,247.0H132.0L146.0,262.0L132.0,277.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="72.0" y="265.0" font-size="13" text-anchor="middle" fill="#111">Пример</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="160.0" y="248.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="158.0" y="246.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="284.0" y="265.0" font-size="13" text-anchor="middle" fill="#111">2, 5, 8, 11…</text></g></g><g class="memo" onclick="this.classList.toggle('open')"><rect x="420.0" y="248.0" width="252.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="418.0" y="246.0" width="252.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="544.0" y="265.0" font-size="13" text-anchor="middle" fill="#111">2, 6, 18, 54…</text></g></g></g></svg>