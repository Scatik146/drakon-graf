<svg xmlns="http://www.w3.org/2000/svg" width="680" height="168" viewBox="0 0 680 168" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,42.5L146.0,75.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="29.0" font-size="14" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="46.0" font-size="14" text-anchor="middle" fill="#111">математическое</text><text x="79.0" y="63.0" font-size="14" text-anchor="middle" fill="#111">ожидание</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="65.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="65.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="46.0" font-size="14" text-anchor="start" fill="#111">Это среднее значение с учётом вероятностей: E X = Σ xi pi.</text></g></g><rect x="640.0" y="29.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="46.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,95.5H146.0L160.0,119.5L146.0,143.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="114.5" font-size="14" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="131.5" font-size="14" text-anchor="middle" fill="#111">дисперсия</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="91.0" width="460.0" height="61.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="89.0" width="460.0" height="61.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="109.0" font-size="14" text-anchor="start" fill="#111">Это среднее квадрата отклонения от ожидания: D X = E(X − E X)².</text><line x1="180.0" y1="126.0" x2="180.0" y2="141.0" stroke="#333" stroke-width="2"/><text 