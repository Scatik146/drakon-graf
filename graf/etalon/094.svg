<svg xmlns="http://www.w3.org/2000/svg" width="680" height="405" viewBox="0 0 680 405" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="152.8" y1="128.0" x2="152.8" y2="246.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="135.6" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="39.0" rx="131.6" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Метод математической</text><text x="350.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">индукции</text><line x1="152.8" y1="39.0" x2="214.4" y2="39.0" stroke="#993300" stroke-width="1.5"/><line x1="152.8" y1="39.0" x2="152.8" y2="82.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="82.0" width="285.6" height="46.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="152.8" y="100.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Чтобы доказать P(n) для всех</text><text x="152.8" y="117.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">натуральных n:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="142.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="140.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="160.0" font-size="14" text-anchor="start" fill="#111">1. База: проверить P(1).</text></g></g><line x1="152.8" y1="156.5" x2="168.8" y2="156.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="187.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="185.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="205.0" font-size="14" text-anchor="start" fill="#111">2. Предположение: пусть P(k) верно.</text></g></g><line x1="152.8" y1="201.5" x2="168.8" y2="201.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="232.0" width="501.2" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="230.0" width="501.2" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="250.0" font-size="14" text-anchor="start" fill="#111">3. Переход: доказать P(k + 1), опираясь на P(k).</text></g></g><line x1="152.8" y1="246.5" x2="168.8" y2="246.5" stroke="#993300" stroke-width="1.5"/></g><line x1="10.0" y1="279.0" x2="670.0" y2="279.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,287.0)"><rect x="10.0" y="10.0" width="660.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="28.0" font-size="14" text-anchor="middle" fill="#111">Тогда P(n) верно при всех n — как падают костяшки домино</text><path d="M331,39V52H320L340,65L360,52H349V39" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="71.0" width="660.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="69.0" width="660.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="89.0" font-size="14" text-anchor="middle" fill="#111">Не забывать базу: без неё «доказывается» и ложное!</text></g></g></g></svg>