<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="100.5" y1="92.0" x2="100.5" y2="252.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Алгоритм Евклида</text><line x1="100.5" y1="30.0" x2="240.0" y2="30.0" stroke="#993300" stroke-width="1.5"/><line x1="100.5" y1="30.0" x2="100.5" y2="64.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="64.0" width="181.0" height="28.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="100.5" y="81.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Чтобы найти НОД(a, b):</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="118.5" y="106.0" width="553.5" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="116.5" y="104.0" width="553.5" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="124.5" y="123.0" font-size="13" text-anchor="start" fill="#111">1. Разделить большее число на меньшее с остатком.</text></g></g><line x1="100.5" y1="120.0" x2="116.5" y2="120.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="118.5" y="150.0" width="553.5" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="116.5" y="148.0" width="553.5" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="124.5" y="167.0" font-size="13" text-anchor="start" fill="#111">2. Заменить большее число остатком.</text></g></g><line x1="100.5" y1="164.0" x2="116.5" y2="164.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="118.5" y="194.0" width="553.5" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="116.5" y="192.0" width="553.5" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="124.5" y="211.0" font-size="13" text-anchor="start" fill="#111">3. Повторять, пока остаток не станет равен нулю.</text></g></g><line x1="100.5" y1="208.0" x2="116.5" y2="208.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="118.5" y="238.0" width="553.5" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="116.5" y="236.0" width="553.5" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="124.5" y="255.0" font-size="13" text-anchor="start" fill="#111">4. Последний ненулевой остаток — это НОД.</text></g></g><rect x="290.0" y="288.0" width="360.0" height="66.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,288.0L410.0,269.0L406.0,288.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="288.0" x2="404.4" y2="288.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="304.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="325.0" font-size="13" text-anchor="middle" fill="#111">НОД(48, 18): 48 = 18 · 2 + 12. 18 =</text><text x="470.0" y="341.0" font-size="13" text-anchor="middle" fill="#111">12 · 1 + 6. 12 = 6 · 2 + 0. Ответ: 6</text><line x1="100.5" y1="252.0" x2="116.5" y2="252.0" stroke="#993300" stroke-width="1.5"/></g></svg>