name: Эталон ДРАКОН-ГРАФ
on:
  push:
  pull_request:
jobs:
  etalon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Шрифты эталона (Liberation, DejaVu, Inter)
        run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fonts-inter
      - name: Сверка с эталоном, геометрия, типографика
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/graf/tests/fonts/fonts.conf
        run: |
          for c in 21d2 22a5 2220 2208 2099 207b; do printf '%s ' $c; fc-match "Arial:charset=$c" family file; done
          fc-match Arial; fc-match Consolas
          node graf/tests/fontprobe.js
          npm test
      - name: Рисунки, отличающиеся от эталона
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff
          path: graf/tests/diff/
