<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="39.0" x2="14.0" y2="233.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="247.4" cy="39.0" rx="168.6" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="247.4" cy="39.0" rx="164.6" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="247.4" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Как сложить дроби с разными</text><text x="247.4" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">знаменателями</text><rect x="434.0" y="22.5" width="230.0" height="33.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M434.0,32.0L415.0,39.0L434.0,46.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="434.0" y1="33.4" x2="434.0" y2="44.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="549.0" y="42.5" font-size="14" text-anchor="middle" fill="#111">Пример: 1/4 + 1/6</text><line x1="14.0" y1="39.0" x2="78.7" y2="39.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="84.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="82.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="102.0" font-size="14" text-anchor="start" fill="#111">1. Найти общий знаменатель — НОК знаменателей: НОК(4, 6) = 12.</text></g></g><line x1="14.0" y1="98.5" x2="30.0" y2="98.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="129.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="127.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="147.0" font-size="14" text-anchor="start" fill="#111">2. Найти дополнительные множители: 12 : 4 = 3, 12 : 6 = 2.</text></g></g><line x1="14.0" y1="143.5" x2="30.0" y2="143.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="174.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="172.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="192.0" font-size="14" text-anchor="start" fill="#111">3. Умножить числители на дополнительные множители: 3/12 + 2/12.</text></g></g><line x1="14.0" y1="188.5" x2="30.0" y2="188.5" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="219.0" width="640.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="217.0" width="640.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="237.0" font-size="14" text-anchor="start" fill="#111">4. Сложить числители: 5/12.</text></g></g><line x1="14.0" y1="233.5" x2="30.0" y2="233.5" stroke="#993300" stroke-width="1.5"/></g></svg>