<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="159.8" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="155.8" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Докажите, что √2 —</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">иррациональное число</text><rect x="100.0" y="80.0" width="480.0" height="155.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="97.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="124.6" y="120.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="130.6" y="120.0" font-size="15" text-anchor="start" fill="#111">Пусть √2 = p/q, дробь несократима</text><text x="124.6" y="144.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="130.6" y="144.0" font-size="15" text-anchor="start" fill="#111">p² = 2q²</text><line x1="379.3" y1="133.0" x2="379.3" y2="148.0" stroke="#993300" stroke-width="1"/><text x="387.3" y="143.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">возвели в квадрат</text><text x="124.6" y="168.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="130.6" y="168.0" font-size="15" text-anchor="start" fill="#111">p = 2k</text><line x1="379.3" y1="157.0" x2="379.3" y2="172.0" stroke="#993300" stroke-width="1"/><text x="387.3" y="167.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">p² чётно, значит, p чётно</text><text x="124.6" y="192.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="130.6" y="192.0" font-size="15" text-anchor="start" fill="#111">q² = 2k²</text><line x1="379.3" y1="181.0" x2="379.3" y2="196.0" stroke="#993300" stroke-width="1"/><text x="387.3" y="191.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">подставили</text><text x="124.6" y="216.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="130.6" y="216.0" font-size="15" text-anchor="start" fill="#111">q чётно</text><line x1="379.3" y1="205.0" x2="379.3" y2="220.0" stroke="#993300" stroke-width="1"/><text x="387.3" y="215.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">так же</text><rect x="100.0" y="247.0" width="480.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="265.0" font-size="14" text-anchor="middle" fill="#111">Противоречие: p и q оба чётные, а дробь несократима.</text></g></svg>