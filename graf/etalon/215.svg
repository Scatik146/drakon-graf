<svg xmlns="http://www.w3.org/2000/svg" width="680" height="358" viewBox="0 0 680 358" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="121.4" y1="108.0" x2="121.4" y2="240.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="124.0" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="120.0" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Как найти общее</text><text x="350.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">сопротивление</text><line x1="121.4" y1="38.0" x2="226.0" y2="38.0" stroke="#993300" stroke-width="1.5"/><line x1="121.4" y1="38.0" x2="121.4" y2="80.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="80.0" width="222.8" height="28.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="121.4" y="97.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Для смешанного соединения:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.4" y="122.0" width="532.6" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.4" y="120.0" width="532.6" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.4" y="139.0" font-size="13" text-anchor="start" fill="#111">1. Найти участки, где резисторы соединены</text><text x="145.4" y="155.0" font-size="13" text-anchor="start" fill="#111">только последовательно или только параллельно.</text></g></g><line x1="121.4" y1="144.0" x2="137.4" y2="144.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.4" y="182.0" width="532.6" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.4" y="180.0" width="532.6" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.4" y="199.0" font-size="13" text-anchor="start" fill="#111">2. Заменить каждый такой участок одним резистором.</text></g></g><line x1="121.4" y1="196.0" x2="137.4" y2="196.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="139.4" y="226.0" width="532.6" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="137.4" y="224.0" width="532.6" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="145.4" y="243.0" font-size="13" text-anchor="start" fill="#111">3. Повторять, пока не останется один резистор.</text></g></g><rect x="290.0" y="276.0" width="360.0" height="66.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,276.0L410.0,257.0L406.0,276.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="276.0" x2="404.4" y2="276.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="292.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="470.0" y="313.0" font-size="13" text-anchor="middle" fill="#111">2 Ом и 2 Ом параллельно = 1 Ом; плюс 3 Ом</text><text x="470.0" y="329.0" font-size="13" text-anchor="middle" fill="#111">последовательно = 4 Ом</text><line x1="121.4" y1="240.0" x2="137.4" y2="240.0" stroke="#993300" stroke-width="1.5"/></g></svg>