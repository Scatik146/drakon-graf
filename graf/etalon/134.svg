<svg xmlns="http://www.w3.org/2000/svg" width="680" height="222" viewBox="0 0 680 222" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,33.0L146.0,56.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="28.0" font-size="13" text-anchor="middle" fill="#111">Формула разности</text><text x="79.0" y="44.0" font-size="13" text-anchor="middle" fill="#111">квадратов</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="36.0" font-size="13" text-anchor="start" fill="#111">a² − b² = (a − b)(a + b)</text></g></g><rect x="640.0" y="20.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="36.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="78.0" width="360.0" height="126.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,78.0L382.0,57.0L376.0,78.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="78.0" x2="374.4" y2="78.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="94.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="280.2" y="116.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="286.2" y="116.0" font-size="14" text-anchor="start" fill="#111">99 · 101</text><text x="280.2" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="286.2" y="139.0" font-size="14" text-anchor="start" fill="#111">(100 − 1)(100 + 1)</text><line x1="407.0" y1="129.0" x2="407.0" y2="143.0" stroke="#993300" stroke-width="1"/><text x="415.0" y="138.0" font-size="12