<svg xmlns="http://www.w3.org/2000/svg" width="680" height="487" viewBox="0 0 680 487" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="30.0" x2="14.0" y2="88.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="110.0" ry="20.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="30.0" rx="106.0" ry="17.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Логарифм</text><line x1="14.0" y1="30.0" x2="240.0" y2="30.0" stroke="#993300" stroke-width="1.5"/><path d="M30.0,73.0H166.0L180.0,88.0L166.0,103.0H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="91.0" font-size="13" text-anchor="middle" fill="#111">Что такое логарифм</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="66.0" width="480.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="64.0" width="480.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="83.0" font-size="13" text-anchor="start" fill="#111">Это показатель степени, в которую надо</text><text x="198.0" y="99.0" font-size="13" text-anchor="start" fill="#111">возвести основание, чтобы получить число.</text></g></g><rect x="300.0" y="134.0" width="360.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M400.0,134.0L422.0,113.0L416.0,134.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="401.6" y1="134.0" x2="414.4" y2="134.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="480.0" y="150.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="480.0" y="171.0" font-size="13" text-anchor="middle" fill="#111">log₂ 8 = 3, так как 2³ = 8</text><line x1="14.0" y1="88.0" x2="30.0" y2="88.0" stroke="#993300" stroke-width="1.5"/></g><li