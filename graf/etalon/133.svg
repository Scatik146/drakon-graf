<svg xmlns="http://www.w3.org/2000/svg" width="680" height="227" viewBox="0 0 680 227" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="30.5" rx="110.0" ry="20.5" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.5" rx="106.0" ry="17.5" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Докажите: a² + b² ≥ 2ab</text><rect x="100.0" y="63.0" width="480.0" height="107.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="80.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="119.6" y="103.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111"></text><text x="125.6" y="103.0" font-size="15" text-anchor="start" fill="#111">a² + b² − 2ab</text><text x="119.6" y="127.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">=</text><text x="125.6" y="127.0" font-size="15" text-anchor="start" fill="#111">(a − b)²</text><line x1="215.8" y1="116.0" x2="215.8" y2="131.0" stroke="#993300" stroke-width="1"/><text x="223.8" y="126.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">формула квадрата разности</text><text x="119.6" y="151.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111">≥</text><text x="125.6" y="151.0" font-size="15" text-anchor="start" fill="#111">0</text><line x1="215.8" y1="140.0" x2="215.8" y2="155.0" stroke="#993300" stroke-width="1"/><text x="223.8" y="150.0" font-size="13" text-anchor="start" font-style="italic" fill="#5a2a00">квадрат неотрицателен</text><rect x="100.0" y="182.0" width="480.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="200.0" font-size="14" text-anchor="middle" fill="#111">Значит, a² + b² ≥ 2ab; равенство при a = b.</text></g></svg>