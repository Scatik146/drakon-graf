<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="29.5" x2="14.0" y2="86.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="29.5" rx="110.0" ry="19.5" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="29.5" rx="106.0" ry="16.5" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="32.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Логарифм</text><line x1="14.0" y1="29.5" x2="240.0" y2="29.5" stroke="#993300" stroke-width="1.5"/><path d="M30.0,71.5H166.0L180.0,86.0L166.0,100.5H30.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="99.0" y="88.5" font-size="12" text-anchor="middle" fill="#111">Что такое логарифм</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="192.0" y="65.0" width="480.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="190.0" y="63.0" width="480.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="198.0" y="81.0" font-size="12" text-anchor="start" fill="#111">Это показатель степени, в которую надо</text><text x="198.0" y="96.0" font-size="12" text-anchor="start" fill="#111">возвести основание, чтобы получить число.</text></g></g><rect x="300.0" y="131.0" width="360.0" height="48.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M400.0,131.0L422.0,110.0L416.0,131.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="401.6" y1="131.0" x2="414.4" y2="131.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="480.0" y="146.0" font-size="12" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="480.0" y="166.0" font-size="12" text-anchor="middle" fill="#111">log₂ 8 = 3, так как 2³ = 8</text><line x1="14.0" y1="86.0" x2="30.0" y2="86.0" stroke="#993300" stroke-width="1.5"/></g><line x1="10.0" y1="195.0" x2="670.0" y2="195.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,203.0)"><g transform="translate(10.0,10.0)"><rect x="0.0" y="0.0" width="660.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><text x="280.8" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">log</text><rect x="302.8" y="9.0" width="15.3" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="310.4" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">ₐ</text><text x="319.0" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="323.9" y="9.0" width="18.6" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="333.2" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">b</text><text x="343.5" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="347.4" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">=</text><text x="355.6" y="25.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="360.4" y="9.0" width="17.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="369.3" y="25.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">c</text><rect x="168.5" y="59.0" width="145.9" height="23.0" rx="11.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M298.3,59.0L310.4,32.0L310.3,59.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="299.5" y1="59.0" x2="309.1" y2="59.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="241.4" y="73.0" font-size="12" text-anchor="middle" fill="#111">основание: a &gt; 0, a ≠ 1</text><rect x="349.3" y="59.0" width="82.0" height="23.0" rx="11.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M363.3,59.0L369.3,32.0L375.3,59.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="364.5" y1="59.0" x2="374.1" y2="59.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="390.3" y="73.0" font-size="12" text-anchor="middle" fill="#111">показатель</text><rect x="290.0" y="90.0" width="86.5" height="23.0" rx="11.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M327.2,90.0L333.2,32.0L339.2,90.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="328.4" y1="90.0" x2="338.0" y2="90.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="333.2" y="104.0" font-size="12" text-anchor="middle" fill="#111">число: b &gt; 0</text></g><rect x="10.0" y="139.0" width="660.0" height="27.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="155.0" font-size="12" text-anchor="middle" fill="#111">Значит:</text><path d="M331,166V179H320L340,192L360,179H349V166" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="198.0" width="660.0" height="31.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="196.0" width="660.0" height="31.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="214.0" font-size="12" text-anchor="middle" fill="#111">aᶜ = b</text></g></g></g></svg>