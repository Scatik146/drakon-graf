<svg xmlns="http://www.w3.org/2000/svg" width="680" height="391" viewBox="0 0 680 391" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="148.0" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="144.0" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Вложенный цикл: таблица</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">умножения</text><g transform="translate(10.0,80.0)"><rect x="90.0" y="93.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="128.3" y="102.0" width="198.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="227.7" y="118.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">for i in range(1, 10):</text><text x="328.1" y="118.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="332.9" y="102.0" width="198.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="432.3" y="118.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">for j in range(1, 10):</text><rect x="307.3" y="0.0" width="250.0" height="63.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M424.3,63.0L432.3,102.0L440.3,63.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="425.9" y1="63.0" x2="438.7" y2="63.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="432.3" y="18.0" font-size="14" text-anchor="middle" fill="#111">Внутренний цикл</text><text x="432.3" y="35.0" font-size="14" text-anchor="middle" fill="#111">проходит полностью</text><text x="432.3" y="52.0" font-size="14" text-anchor="middle" fill="#111">на каждом шаге внешнего.</text><rect x="187.5" y="152.0" width="80.4" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M221.7,152.0L227.7,125.0L233.7,152.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="222.9" y1="152.0" x2="232.5" y2="152.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="227.7" y="168.0" font-size="14" text-anchor="middle" fill="#111">внешний</text><rect x="382.7" y="152.0" width="99.2" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M426.3,152.0L432.3,125.0L438.3,152.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="427.5" y1="152.0" x2="437.1" y2="152.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="432.3" y="168.0" font-size="14" text-anchor="middle" fill="#111">внутренний</text></g></g><line x1="10.0" y1="277.0" x2="670.0" y2="277.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,285.0)"><rect x="18.0" y="18.0" width="224.8" height="70.0" rx="3" fill="#F6F3EA" stroke="#C9BFA6" stroke-width="1"/><text x="26.0" y="33.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">for i in range(1, 10):</text><text x="26.0" y="48.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    for j in range(1, 10):</text><text x="26.0" y="63.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">        print(i * j, end=' ')</text><text x="26.0" y="78.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    print()</text></g></svg>