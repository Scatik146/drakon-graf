<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,33.0L146.0,56.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="28.0" font-size="13" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="44.0" font-size="13" text-anchor="middle" fill="#111">причастный оборот</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="500.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="500.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="36.0" font-size="13" text-anchor="start" fill="#111">Это причастие с зависимыми словами.</text></g></g><g transform="translate(10.0,68.0)"><rect x="0.0" y="96.0" width="660.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="149.9" y="105.0" width="77.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="188.8" y="121.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Опавшие</text><text x="228.7" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="233.6" y="105.0" width="65.4" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="266.3" y="121.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">с берёз</text><text x="300.0" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="304.9" y="105.0" width="62.9" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="336.3" y="121.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">листья</text><text x="368.8" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="372.7" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">[усыпали</text><text x="438.3" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="442.2" y="121.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">тропинку]</text><rect x="0.0" y="0.0" width="130.9" height="44.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M104.9,44.0L147.9,116.5L120.9,44.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="106.5" y1="44.0" x2="119.3" y2="44.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="65.4" y="17.0" font-size="13" text-anchor="middle" fill="#111">Причастный</text><text x="65.4" y="33.0" font-size="13" text-anchor="middle" fill="#111">оборот</text><path d="M336.3,105.0V72.0H188.8V102.0" fill="none" stroke="#993300" stroke-width="1.8"/><path d="M183.8,96.0L188.8,105.0L193.8,96.0Z" fill="#993300"/><rect x="231.5" y="60.0" width="62.2" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><text x="262.6" y="75.0" font-size="13" text-anchor="middle" fill="#111">Какие?</text><rect x="146.4" y="165.1" width="84.8" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M182.8,165.1L188.8,128.0L194.8,165.1" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="184.0" y1="165.1" x2="193.6" y2="165.1" stroke="#FFFF99" stroke-width="2.8"/></g><text x="188.8" y="180.1" font-size="13" text-anchor="middle" fill="#111">Причастие</text><rect x="241.2" y="165.1" width="127.6" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M260.3,165.1L266.3,128.0L272.3,165.1" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="261.5" y1="165.1" x2="271.1" y2="165.1" stroke="#FFFF99" stroke-width="2.8"/></g><text x="305.0" y="180.1" font-size="13" text-anchor="middle" fill="#111">Зависимые слова</text><rect x="378.8" y="165.1" width="137.4" height="24.0" rx="12" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M382.8,165.1L336.3,128.0L394.8,165.1" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="384.0" y1="165.1" x2="393.6" y2="165.1" stroke="#FFFF99" stroke-width="2.8"/></g><text x="447.5" y="180.1" font-size="13" text-anchor="middle" fill="#111">Не входит в оборот</text></g><rect x="10.0" y="273.1" width="660.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="290.1" font-size="13" text-anchor="middle" fill="#111">Почему «листья» не входит? Потому что есть правило:</text><path d="M331,301.08681640625V314.08681640625H320L340,327.08681640625L360,314.08681640625H349V301.08681640625" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="333.1" width="660.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="331.1" width="660.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="350.1" font-size="13" text-anchor="middle" fill="#111">В причастный оборот не входит определяемое им существительное.</text></g></g></g></svg>