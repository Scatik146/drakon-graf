<svg xmlns="http://www.w3.org/2000/svg" width="680" height="229" viewBox="0 0 680 229" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,33.0H146.0L160.0,48.0L146.0,63.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="51.0" font-size="13" text-anchor="middle" fill="#111">Теорема Виета</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="76.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="76.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="29.0" font-size="13" text-anchor="start" fill="#111">Для x² + px + q = 0 сумма корней равна −p, произведение равно q.</text><rect x="178.0" y="45.0" width="444.0" height="33.0" rx="0" fill="#fff" stroke="#993300" stroke-width="2"/><text x="400.0" y="65.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">x₁ + x₂ = −p, x₁ x₂ = q</text></g></g><rect x="640.0" y="35.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="51.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="108.0" width="360.0" height="103.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,108.0L382.0,87.0L376.0,108.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="108.0" x2="374.4" y2="108.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="124.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="285.4" y="146.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="291.4" y="146.0" font-size="14" text-anchor="start" fill="#111">x² − 5x + 6 = 0</text><text x="285.4" y="169.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="291.4" y="169.0" font-size="14" text-anchor="start" fill="#111">x₁ + x₂ = 5, x₁ x₂ = 6</text><line x1="422.8" y1="159.0" x2="422.8" y2="173.0" stroke="#993300" stroke-width="1"/><text x="430.8" y="168.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">по теореме Виета</text><text x="285.4" y="192.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="291.4" y="192.0" font-size="14" text-anchor="start" fill="#111">x₁ = 2, x₂ = 3</text><line x1="422.8" y1="182.0" x2="422.8" y2="196.0" stroke="#993300" stroke-width="1"/><text x="430.8" y="191.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">подобрали</text></g></svg>