<svg xmlns="http://www.w3.org/2000/svg" width="680" height="258" viewBox="0 0 680 258" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><path d="M10.0,24.5H165.7L179.7,48.5L165.7,72.5H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="88.8" y="43.5" font-size="14" text-anchor="middle" fill="#111">Что такое скалярное</text><text x="88.8" y="60.5" font-size="14" text-anchor="middle" fill="#111">произведение</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="191.7" y="12.0" width="440.3" height="77.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="189.7" y="10.0" width="440.3" height="77.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="197.7" y="30.0" font-size="14" text-anchor="start" fill="#111">Это произведение длин векторов на косинус угла между ними.</text><rect x="197.7" y="46.0" width="424.3" height="33.0" rx="0" fill="#fff" stroke="#993300" stroke-width="2"/><text x="409.8" y="66.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">a · b = |a| |b| cos φ = x₁ x₂ + y₁ y₂</text></g></g><rect x="640.0" y="35.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="52.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,101.0H165.7L179.7,125.0L165.7,149.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="88.8" y="120.0" font-size="14" text-anchor="middle" fill="#111">Свойство</text><text x="88.8" y="137.0" font-size="14" text-anchor="middle" fill="#111">перпендикулярности</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="191.7" y="103.0" width="440.3" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="189.7" y="101.0" width="440.3" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="197.7" y="128.5" font-size="14" text-anchor="start" fill="#111">a ⊥ b ⇔ a · b = 0</text></g></g><rect x="640.0" y="112.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="129.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">2</text><rect x="260.0" y="171.0" width="360.0" height="69.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,171.0L382.0,150.0L376.0,171.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="171.0" x2="374.4" y2="171.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="188.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="210.0" font-size="14" text-anchor="middle" fill="#111">(2; 3) · (3; −2) = 6 − 6 = 0 — векторы</text><text x="440.0" y="227.0" font-size="14" text-anchor="middle" fill="#111">перпендикулярны</text></g></svg>