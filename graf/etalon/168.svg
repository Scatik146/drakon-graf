<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,25.0H151.8L165.8,48.0L151.8,71.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="81.9" y="43.0" font-size="13" text-anchor="middle" fill="#111">Что такое скалярное</text><text x="81.9" y="59.0" font-size="13" text-anchor="middle" fill="#111">произведение</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="177.8" y="12.0" width="454.2" height="76.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="175.8" y="10.0" width="454.2" height="76.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="183.8" y="29.0" font-size="13" text-anchor="start" fill="#111">Это произведение длин векторов на косинус угла между ними.</text><rect x="183.8" y="45.0" width="438.2" height="33.0" rx="0" fill="#fff" stroke="#993300" stroke-width="2"/><text x="402.9" y="65.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">a · b = |a| |b| cos φ = x₁ x₂ + y₁ y₂</text></g></g><rect x="640.0" y="35.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="51.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,100.0H151.8L165.8,123.0L151.8,146.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="81.9" y="118.0" font-size="13" text-anchor="middle" fill="#111">Свойство</text><text x="81.9" y="134.0" font-size="13" text-anchor="middle" fill="#111">перпендикулярности</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="177.8" y="102.0" width="454.2" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="175.8" y="100.0" width="454.2" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="183.8" y="126.0" font-size="13" text-anchor="start" fill="#111">a ⊥ b ⇔ a · b = 0</text></g></g><rect x="640.0" y="110.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="126.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">2</text><rect x="260.0" y="168.0" width="360.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,168.0L382.0,147.0L376.0,168.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="168.0" x2="374.4" y2="168.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="184.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="205.0" font-size="13" text-anchor="middle" fill="#111">(2; 3) · (3; −2) = 6 − 6 = 0 — векторы перпендикулярны</text></g></svg>