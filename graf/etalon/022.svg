<svg xmlns="http://www.w3.org/2000/svg" width="680" height="266" viewBox="0 0 680 266" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,40.0H146.0L160.0,63.0L146.0,86.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="58.0" font-size="13" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="74.0" font-size="13" text-anchor="middle" fill="#111">модуль числа</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="106.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="106.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="29.0" font-size="13" text-anchor="start" fill="#111">Это расстояние от нуля до точки на координатной прямой.</text><circle cx="182.0" cy="52.0" r="4.2" fill="#CC6600"/><text x="192.0" y="56.0" font-size="13" text-anchor="start" fill="#111">|a| = a, если a ≥ 0</text><circle cx="182.0" cy="72.0" r="4.2" fill="#CC6600"/><text x="192.0" y="76.0" font-size="13" text-anchor="start" fill="#111">|a| = −a, если a &lt; 0</text><line x1="180.0" y1="93.0" x2="180.0" y2="107.0" stroke="#333" stroke-width="2"/><text x="188.0" y="103.0" font-size="13" text-anchor="start" fill="#111">Модуль не бывает отрицательным.</text></g></g><rect x="640.0" y="50.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="66.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">1</text><path d="M10.0,130.0H146.0L160.0,153.0L146.0,176.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="148.0" font-size="13" text-anchor="middle" fill="#111">Уравнение</text><text x="79.0" y="164.0" font-size="13" text-anchor="middle" fill="#111">с модулем</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="132.0" width="460.0" height="46.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="130.0" width="460.0" height="46.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="156.0" font-size="13" text-anchor="start" fill="#111">Это уравнение, в котором переменная стоит под знаком модуля.</text></g></g><rect x="640.0" y="140.0" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="156.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">2</text><rect x="260.0" y="198.0" width="360.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,198.0L382.0,177.0L376.0,198.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="198.0" x2="374.4" y2="198.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="214.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="235.0" font-size="13" text-anchor="middle" fill="#111">|x| = 3 → x = 3 или x = −3</text></g></svg>