<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="14.0" y1="38.0" x2="14.0" y2="351.0" stroke="#993300" stroke-width="1.5"/><ellipse cx="304.0" cy="38.0" rx="112.0" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="304.0" cy="38.0" rx="108.0" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="304.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Как решать задачу</text><text x="304.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">на части</text><rect x="434.0" y="14.0" width="230.0" height="48.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M434.0,29.0L415.0,38.0L434.0,43.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="434.0" y1="30.4" x2="434.0" y2="41.6" stroke="#FFFF99" stroke-width="2.8"/></g><text x="549.0" y="33.0" font-size="13" text-anchor="middle" fill="#111">Для варенья берут 2 части ягод и 3</text><text x="549.0" y="49.0" font-size="13" text-anchor="middle" fill="#111">части сахара. Всего 10 кг.</text><line x1="14.0" y1="38.0" x2="191.9" y2="38.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="82.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="80.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="99.0" font-size="13" text-anchor="start" fill="#111">1. Принять одну часть за x.</text></g></g><line x1="14.0" y1="96.0" x2="30.0" y2="96.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="126.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="124.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="143.0" font-size="13" text-anchor="start" fill="#111">2. Выразить все величины через x: ягоды 2x, сахар 3x.</text></g></g><line x1="14.0" y1="140.0" x2="30.0" y2="140.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="170.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="168.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="187.0" font-size="13" text-anchor="start" fill="#111">3. Составить уравнение по общему количеству.</text></g></g><rect x="290.0" y="220.0" width="360.0" height="103.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M390.0,220.0L410.0,201.0L406.0,220.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="391.6" y1="220.0" x2="404.4" y2="220.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="470.0" y="236.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="315.4" y="258.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="321.4" y="258.0" font-size="14" text-anchor="start" fill="#111">2x + 3x = 10</text><text x="315.4" y="281.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="321.4" y="281.0" font-size="14" text-anchor="start" fill="#111">5x = 10</text><line x1="406.4" y1="271.0" x2="406.4" y2="285.0" stroke="#993300" stroke-width="1"/><text x="414.4" y="280.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">привели подобные</text><text x="315.4" y="304.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="321.4" y="304.0" font-size="14" text-anchor="start" fill="#111">x = 2</text><line x1="406.4" y1="294.0" x2="406.4" y2="308.0" stroke="#993300" stroke-width="1"/><text x="414.4" y="303.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">одна часть — 2 кг</text><line x1="14.0" y1="184.0" x2="30.0" y2="184.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="32.0" y="337.0" width="640.0" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="30.0" y="335.0" width="640.0" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="38.0" y="354.0" font-size="13" text-anchor="start" fill="#111">4. Ответить на вопрос задачи: ягод 4 кг, сахара 6 кг.</text></g></g><line x1="14.0" y1="351.0" x2="30.0" y2="351.0" stroke="#993300" stroke-width="1.5"/></g></svg>