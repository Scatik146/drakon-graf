<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="30.5" rx="110.0" ry="20.5" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="30.5" rx="106.0" ry="17.5" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Рекурсивная функция</text><g transform="translate(10.0,63.0)"><rect x="90.0" y="59.0" width="480.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="158.5" y="68.0" width="173.6" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="245.3" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">if n == 0: return 1</text><text x="333.1" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="336.6" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">·</text><text x="340.2" y="84.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="344.7" y="68.0" width="156.8" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="423.1" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">return n * f(n−1)</text><rect x="120.3" y="0.0" width="250.0" height="29.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M237.3,29.0L245.3,68.0L253.3,29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="238.9" y1="29.0" x2="251.7" y2="29.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="245.3" y="18.0" font-size="14" text-anchor="middle" fill="#111">Без базы рекурсия не остановится!</text><rect x="221.5" y="118.0" width="47.6" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M239.3,118.0L245.3,91.0L251.3,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="240.5" y1="118.0" x2="250.1" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="245.3" y="134.0" font-size="14" text-anchor="middle" fill="#111">база</text><rect x="401.9" y="118.0" width="42.4" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M417.1,118.0L423.1,91.0L429.1,118.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="418.3" y1="118.0" x2="427.9" y2="118.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="423.1" y="134.0" font-size="14" text-anchor="middle" fill="#111">шаг</text></g></g><line x1="10.0" y1="226.0" x2="670.0" y2="226.0" stroke="#D8C8A8" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="translate(0.0,234.0)"><rect x="18.0" y="18.0" width="181.6" height="70.0" rx="3" fill="#F6F3EA" stroke="#C9BFA6" stroke-width="1"/><text x="26.0" y="33.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">def f(n):</text><text x="26.0" y="48.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    if n == 0:</text><text x="26.0" y="63.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">        return 1</text><text x="26.0" y="78.0" font-size="12" text-anchor="start" font-family='"PT Mono", monospace' xml:space="preserve" fill="#111">    return n * f(n - 1)</text></g></svg>