<svg xmlns="http://www.w3.org/2000/svg" width="680" height="258" viewBox="0 0 680 258" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,42.5L146.0,75.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="29.0" font-size="14" text-anchor="middle" fill="#111">Теорема</text><text x="79.0" y="46.0" font-size="14" text-anchor="middle" fill="#111">о делимости</text><text x="79.0" y="63.0" font-size="14" text-anchor="middle" fill="#111">суммы</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="460.0" height="65.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="460.0" height="65.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="46.0" font-size="14" text-anchor="start" fill="#111">Каждое слагаемое делится на число? Тогда и сумма делится.</text></g></g><rect x="640.0" y="29.5" width="26.0" height="26.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="653.0" y="46.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">1</text><rect x="260.0" y="97.0" width="360.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,97.0L382.0,76.0L376.0,97.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="97.0" x2="374.4" y2="97.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="114.0" font-size="14" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="440.0" y="136.0" font-size="14" text-anchor="middle" fill="#111">35 и 14 делятся на 7. Значит, 49 делится на 7</text><rect x="260.0" y="171.0" width="360.0" height="69.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><g data-k="tail"><path d="M360.0,171.0L382.0,150.0L376.0,171.0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><line x1="361.6" y1="171.0" x2="374.4" y2="171.0" stroke="#FFFFFF" stroke-width="2.8"/></g><text x="440.0" y="188.0" font-size="14" text-anchor="middle" font-style="italic" fill="#8B0000">Контрпример ✗</text><text x="440.0" y="210.0" font-size="14" text-anchor="middle" fill="#111">5 + 9 = 14 делится на 7, но слагаемые — нет.</text><text x="440.0" y="227.0" font-size="14" text-anchor="middle" fill="#111">Обратное неверно!</text></g></svg>