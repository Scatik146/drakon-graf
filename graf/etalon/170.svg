<svg xmlns="http://www.w3.org/2000/svg" width="680" height="391" viewBox="0 0 680 391" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><line x1="152.8" y1="124.0" x2="152.8" y2="321.5" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="136.2" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="350.0" cy="38.0" rx="132.2" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="350.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Построение сечения</text><text x="350.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">методом следов</text><line x1="152.8" y1="38.0" x2="213.8" y2="38.0" stroke="#993300" stroke-width="1.5"/><line x1="152.8" y1="38.0" x2="152.8" y2="80.0" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="80.0" width="285.6" height="44.0" rx="12" fill="#FFCC66" stroke="#993300" stroke-width="1.5"/><text x="152.8" y="97.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Чтобы построить сечение</text><text x="152.8" y="113.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">плоскостью MNK:</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="138.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="136.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="155.0" font-size="13" text-anchor="start" fill="#111">1. Соединить точки, лежащие в одной грани.</text></g></g><line x1="152.8" y1="152.0" x2="168.8" y2="152.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="182.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="180.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="199.0" font-size="13" text-anchor="start" fill="#111">2. Продлить отрезок до пересечения с прямой основания — найти след.</text></g></g><line x1="152.8" y1="196.0" x2="168.8" y2="196.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="226.0" width="501.2" height="32.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="224.0" width="501.2" height="32.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="243.0" font-size="13" text-anchor="start" fill="#111">3. Через след провести прямую в плоскости основания.</text></g></g><line x1="152.8" y1="240.0" x2="168.8" y2="240.0" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="170.8" y="270.0" width="501.2" height="107.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="168.8" y="268.0" width="501.2" height="107.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="176.8" y="287.0" font-size="13" text-anchor="start" fill="#111">4. Соединить новые точки в гранях и обвести многоугольник.</text><rect x="176.8" y="303.0" width="485.2" height="64.0" rx="4" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/><text x="419.4" y="338.0" font-size="13" text-anchor="middle" font-style="italic" fill="#666">рисунок: куб, точки M, N, K на рёбрах</text></g></g><line x1="152.8" y1="321.5" x2="168.8" y2="321.5" stroke="#993300" stroke-width="1.5"/></g></svg>