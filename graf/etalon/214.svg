<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="154.0" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="150.0" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">Смешали 1 кг воды</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">при 80 °C и 3 кг при 20 °C</text><rect x="100.0" y="78.0" width="480.0" height="126.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="94.0" font-size="13" text-anchor="middle" font-style="italic" fill="#555">Пример</text><text x="125.4" y="116.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111"></text><text x="131.4" y="116.0" font-size="14" text-anchor="start" fill="#111">Qотд = Qпол</text><text x="125.4" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="139.0" font-size="14" text-anchor="start" fill="#111">c·1·(80 − t) = c·3·(t − 20)</text><line x1="293.0" y1="129.0" x2="293.0" y2="143.0" stroke="#993300" stroke-width="1"/><text x="301.0" y="138.0" font-size="12" text-anchor="start" font-style="italic" fill="#5a2a00">c сокращается</text><text x="125.4" y="162.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="162.0" font-size="14" text-anchor="start" fill="#111">80 − t = 3t − 60</text><text x="125.4" y="185.0" font-size="14" text-anchor="end" font-weight="bold" fill="#111">⇒</text><text x="131.4" y="185.0" font-size="14" text-anchor="start" fill="#111">t = 35 °C</text></g></svg>