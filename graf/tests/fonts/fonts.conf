<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Эталон ДРАКОН-ГРАФ v8 снят только с этими шрифтами:
     Liberation Sans и Liberation Mono (вместо Arial и Courier New), DejaVu Sans, Inter (запасные для ⇒ ⊥ ∠ ∈ ₙ ⁻). -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/liberation2</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/opentype/inter</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <!-- порядок запасных шрифтов задан явно: системные настройки на разных машинах различаются -->
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Liberation Sans</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <cachedir>/tmp/drakon-graf-fontcache</cachedir>
</fontconfig>
