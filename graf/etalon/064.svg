<svg xmlns="http://www.w3.org/2000/svg" width="680" height="374" viewBox="0 0 680 374" font-family="PT Sans, sans-serif"><g transform="translate(0.0,0.0)"><path d="M10.0,10.0H146.0L160.0,34.0L146.0,58.0H10.0Z" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="79.0" y="29.0" font-size="14" text-anchor="middle" fill="#111">Что такое</text><text x="79.0" y="46.0" font-size="14" text-anchor="middle" fill="#111">причастный оборот</text><g class="memo" onclick="this.classList.toggle('open')"><rect x="172.0" y="12.0" width="500.0" height="48.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="170.0" y="10.0" width="500.0" height="48.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="178.0" y="37.5" font-size="14" text-anchor="start" fill="#111">Это причастие с зависимыми словами.</text></g></g><g transform="translate(10.0,70.0)"><rect x="0.0" y="82.0" width="660.0" height="41.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.6"/><rect x="170.3" y="91.0" width="70.1" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="205.4" y="107.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">Опавшие</text><text x="241.5" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="246.0" y="91.0" width="59.0" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="275.5" y="107.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">с берёз</text><text x="306.0" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><rect x="310.5" y="91.0" width="54.3" height="23.0" rx="11.5" fill="#fff" stroke="#333333" stroke-width="1.1"/><text x="337.7" y="107.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">листья</text><text x="365.9" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="369.4" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">[усыпали</text><text x="425.7" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111"> </text><text x="429.2" y="107.5" font-size="14" text-anchor="start" font-weight="bold" fill="#111">тропинку]</text><rect x="0.0" y="0.0" width="151.3" height="29.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><g data-k="tail"><path d="M125.3,29.0L168.3,102.5L141.3,29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="126.9" y1="29.0" x2="139.7" y2="29.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="75.7" y="18.0" font-size="14" text-anchor="middle" fill="#111">Причастный оборот</text><path d="M337.7,91.0V57.5H205.4V88.0" fill="none" stroke="#993300" stroke-width="1.8"/><path d="M200.4,82.0L205.4,91.0L210.4,82.0Z" fill="#993300"/><rect x="240.0" y="45.0" width="63.0" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><text x="271.6" y="61.0" font-size="14" text-anchor="middle" fill="#111">Какие?</text><rect x="163.1" y="154.0" width="84.7" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M199.4,154.0L205.4,114.0L211.4,154.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="200.6" y1="154.0" x2="210.2" y2="154.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="205.4" y="170.0" font-size="14" text-anchor="middle" fill="#111">Причастие</text><rect x="257.7" y="154.0" width="127.0" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M269.5,154.0L275.5,114.0L281.5,154.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="270.7" y1="154.0" x2="280.3" y2="154.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="321.3" y="170.0" font-size="14" text-anchor="middle" fill="#111">Зависимые слова</text><rect x="394.8" y="154.0" width="139.8" height="25.0" rx="12.5" fill="#FFFF99" stroke="#993300" stroke-width="1.1"/><g data-k="tail"><path d="M398.8,154.0L337.7,114.0L410.8,154.0" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><line x1="400.0" y1="154.0" x2="409.6" y2="154.0" stroke="#FFFF99" stroke-width="2.8"/></g><text x="464.6" y="170.0" font-size="14" text-anchor="middle" fill="#111">Не входит в оборот</text></g><rect x="10.0" y="265.0" width="660.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="283.0" font-size="14" text-anchor="middle" fill="#111">Почему «листья» не входит? Потому что есть правило:</text><path d="M331,294.0105682373047V307.0105682373047H320L340,320.0105682373047L360,307.0105682373047H349V294.0105682373047" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="326.0" width="660.0" height="33.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="324.0" width="660.0" height="33.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="340.0" y="344.0" font-size="14" text-anchor="middle" fill="#111">В причастный оборот не входит определяемое им существительное.</text></g></g></g></svg>