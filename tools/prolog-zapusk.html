<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Запуск Prolog</title></head>
<body>
<p id="status">Загружаю SWI-Prolog…</p>
<!-- Страница для tools/prolog-zapusk.py: поднимает swipl-wasm из стенда и даёт слова swipl, ask, str. -->
<script>
const LIB = '../site/experiments/prolog/lib/';
let swipl = null;

// загрузить: подключает скрипт и ждёт его
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}

// ask: один ответ Prolog на запрос с входными данными
function ask(goal, input) { return swipl.prolog.query(goal, input).once(); }

// str: значение Prolog — строкой JS
function str(value) { return value == null ? '' : String(value); }

// старт: поднять Prolog и сообщить странице
async function start() {
  await loadScript(LIB + 'swipl-web.js');
  swipl = await SWIPL({ arguments: ['-q'], locateFile: (f) => LIB + f });
  document.getElementById('status').textContent = 'Prolog готов';
}
start();
</script>
</body></html>
