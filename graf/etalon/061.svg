<svg xmlns="http://www.w3.org/2000/svg" width="680" height="261" viewBox="0 0 680 261" font-family="PT Serif, serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="39.0" rx="122.8" ry="29.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="39.0" rx="118.8" ry="26.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="34.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">«Золотое правило»</text><text x="340.0" y="51.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">механики</text><rect x="10.0" y="80.0" width="660.0" height="33.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="100.0" font-size="14" text-anchor="middle" fill="#111">Ни один механизм не даёт выигрыша в работе.</text><rect x="10.0" y="125.0" width="660.0" height="29.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="143.0" font-size="14" text-anchor="middle" fill="#111">Во сколько раз выигрываем в силе —</text><path d="M331,154V167H320L340,180L360,167H349V154" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="186.0" width="660.0" height="61.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="184.0" width="660.0" height="61.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="18.0" y="204.0" font-size="14" text-anchor="start" fill="#111">во столько же раз проигрываем в расстоянии.</text><line x1="20.0" y1="221.0" x2="20.0" y2="236.0" stroke="#333" stroke-width="2"/><text x="28.0" y="232.0" font-size="14" text-anchor="start" fill="#111">Рычаг, блок, наклонная плоскость — все подчиняются правилу.</text></g></g></g></svg>