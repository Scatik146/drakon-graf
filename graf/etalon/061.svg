<svg xmlns="http://www.w3.org/2000/svg" width="680" height="255" viewBox="0 0 680 255" font-family="Arial, Helvetica, sans-serif"><g transform="translate(0.0,0.0)"><ellipse cx="340.0" cy="38.0" rx="116.6" ry="28.0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><ellipse cx="340.0" cy="38.0" rx="112.6" ry="25.0" fill="none" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="33.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">«Золотое правило»</text><text x="340.0" y="49.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">механики</text><rect x="10.0" y="78.0" width="660.0" height="32.0" rx="3" fill="#FFFF99" stroke="#993300" stroke-width="1.2"/><text x="340.0" y="97.0" font-size="13" text-anchor="middle" fill="#111">Ни один механизм не даёт выигрыша в работе.</text><rect x="10.0" y="122.0" width="660.0" height="28.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><text x="340.0" y="139.0" font-size="13" text-anchor="middle" fill="#111">Во сколько раз выигрываем в силе —</text><path d="M331,150V163H320L340,176L360,163H349V150" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo" onclick="this.classList.toggle('open')"><rect x="12.0" y="182.0" width="660.0" height="59.0" rx="0" fill="#993300" stroke="#993300" stroke-width="1.5"/><rect x="10.0" y="180.0" width="660.0" height="59.0" rx="0" fill="#FFFF99" stroke="#993300" stroke-width="1.5"/><g class="memo-t"><text x="18.0" y="199.0" font-size="13" text-anchor="start" fill="#111">во столько же раз проигрываем в расстоянии.</text><line x1="20.0" y1="216.0" x2="20.0" y2="230.0" stroke="#333" stroke-width="2"/><text x="28.0" y="226.0" font-size="13" text-anchor="start" fill="#111">Рычаг, блок, наклонная плоскость — все подчиняются правилу.</text></g></g></g></svg>